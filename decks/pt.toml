# Hand-curated Brazilian Portuguese for English speakers: full phrases for real situations.
# The first words and short chunks are in pt.basics.toml.
language = "pt-BR"
native = "en"
language_name = "Portuguese"
title = "Portuguese for real life"

# ---------------------------------------------------------------- tips

[[tip]]
text = "False friend: 'puxe' on a door means PULL. Push is 'empurre'."
[[tip]]
text = "False friend: 'pretender' means to intend. To pretend is 'fingir'."
[[tip]]
text = "False friend: 'atualmente' means currently. Actually is 'na verdade'."
[[tip]]
text = "False friend: 'esquisito' means weird, not exquisite."
[[tip]]
text = "False friend: 'parentes' are relatives. Parents are 'pais'."
[[tip]]
text = "False friend: 'livraria' is a bookshop. A library is 'biblioteca'."
[[tip]]
text = "Pronunciation: a final 'm' is nasal, never a closed 'm': 'bem' sounds like 'bayng'."
[[tip]]
text = "Pronunciation: 'ão' is a nasal 'own' said through the nose: 'não', 'pão', 'coração'."
[[tip]]
text = "Pronunciation: 'lh' is like the 'lli' in 'million'; 'nh' is like the 'ny' in 'canyon'."
[[tip]]
text = "Pronunciation: 'de' and 'te' at the end of a word sound like 'jee' and 'chee': 'cidade', 'noite'."
[[tip]]
text = "Pronunciation: an 'r' at the start of a word sounds like an English 'h': 'Rio' = 'HEE-oo'."
[[tip]]
text = "Spoken Brazilian shortens: 'estou' becomes 'tô', 'está' becomes 'tá', 'para' becomes 'pra'."
[[tip]]
text = "'Você' is the everyday 'you'. 'O senhor' and 'a senhora' are the polite forms for older people."
[[tip]]
text = "'Tudo bem?' is both the question and the answer: 'Tudo bem?' 'Tudo bem!'."
[[tip]]
text = "A man says 'obrigado', a woman says 'obrigada'."
[[tip]]
text = "Adding '-inho' softens almost anything: 'um minutinho', 'um cafezinho', 'rapidinho'."

# ---------------------------------------------------------------- phone, A1 to B1

[[phrase]]
topic = "telefone"
level = "A1"
situation = "You pick up the phone and don't recognize the voice."
say = "Com quem eu falo?"
polished = "Com quem eu falo, por favor?"
meaning = "Who am I speaking with?"
accept = ["Com quem estou falando?", "Quem está falando?"]

[[phrase]]
topic = "telefone"
level = "A1"
situation = "The line goes quiet and you're not sure the other person can hear you."
say = "Você está me ouvindo?"
polished = "Alô, você está me ouvindo bem?"
meaning = "Can you hear me?"
accept = ["Está me ouvindo?", "Tá me ouvindo?"]

[[phrase]]
topic = "telefone"
level = "A1"
situation = "You call a friend's home and someone else picks up."
say = "Posso falar com a Ana?"
short = "A Ana, por favor."
polished = "Oi, eu poderia falar com a Ana, por favor?"
meaning = "Can I speak to Ana?"
accept = ["Eu posso falar com a Ana?", "A Ana está?"]
tip = "Names take an article in Brazil: 'a Ana', 'o Pedro'."

[[phrase]]
topic = "telefone"
level = "A1"
situation = "The doorbell rings in the middle of a call and you have to go open the door."
say = "Espera um segundo."
short = "Espera aí."
polished = "Você pode esperar um segundo, por favor?"
meaning = "Hold on a second."
accept = ["Só um segundo", "Um segundinho"]

[[phrase]]
topic = "telefone"
level = "A1"
situation = "A friend calls just as you're getting on the bus."
say = "Eu te ligo de volta."
short = "Te ligo de volta."
polished = "Posso te ligar de volta em dez minutos?"
meaning = "I'll call you back."
accept = ["Te retorno", "Já te ligo"]

[[phrase]]
topic = "telefone"
level = "A2"
situation = "You can't make tomorrow's doctor's appointment and call the clinic."
say = "Preciso remarcar minha consulta."
short = "Posso remarcar?"
polished = "Oi, preciso remarcar minha consulta, por favor."
meaning = "I need to reschedule my appointment."
accept = ["Preciso remarcar a minha consulta"]
tip = "'Consulta' is a doctor's appointment: 'marcar' books it, 'remarcar' moves it."

[[phrase]]
topic = "telefone"
level = "A2"
situation = "The receptionist read out the phone number too fast for you to write down."
say = "Pode repetir o número?"
short = "O número de novo?"
polished = "Desculpa, pode repetir o número mais devagar?"
meaning = "Could you repeat the number?"
accept = ["Você pode repetir o número?"]

[[phrase]]
topic = "telefone"
level = "A2"
situation = "The signal is bad and the other person's voice keeps dropping."
say = "A ligação está cortando."
short = "Está cortando."
polished = "Desculpa, a ligação está cortando, quase não te ouço."
meaning = "You're breaking up."
accept = ["A ligação tá cortando", "Tá cortando"]

[[phrase]]
topic = "telefone"
level = "A2"
situation = "A friend explains where the party is, but you'd rather have it in writing."
say = "Me manda o endereço por mensagem?"
short = "Me manda o endereço."
polished = "Você pode me mandar o endereço por mensagem, por favor?"
meaning = "Can you text me the address?"
accept = ["Você me manda o endereço por mensagem?"]
tip = "'Endereço' is a street address. In Brazil a 'mensagem' is almost always WhatsApp."

[[phrase]]
topic = "telefone"
level = "A2"
situation = "Your friend doesn't pick up and you leave a voice message."
say = "Me liga quando puder."
short = "Me liga."
polished = "Oi, sou eu, me liga quando puder."
meaning = "Call me when you can."
accept = ["Me liga quando você puder"]

[[phrase]]
topic = "telefone"
level = "A2"
situation = "The agent asks if you can stay on the line."
say = "Claro, eu aguardo."
polished = "Claro, sem problema, eu aguardo."
meaning = "Sure, I can hold."
accept = ["Claro, eu espero", "Sim, eu aguardo"]

[[phrase]]
topic = "telefone"
level = "B1"
situation = "Your home internet is down and you call support."
say = "Estou ligando por causa da minha internet."
short = "É sobre a minha internet."
polished = "Oi, estou ligando por causa de um problema na minha internet."
meaning = "I'm calling about my internet."
accept = ["Tô ligando por causa da minha internet"]
tip = "'Estou ligando por causa de...' is the standard way to give the reason for a call."

[[phrase]]
topic = "telefone"
level = "B1"
situation = "The call dropped mid-conversation and you call again."
say = "Desculpa, a ligação caiu."
short = "A ligação caiu."
polished = "Desculpa, acho que a ligação caiu."
meaning = "Sorry, we got cut off."
accept = ["Desculpe, a ligação caiu"]
tip = "A call 'falls' in Portuguese: 'a ligação caiu'."

[[phrase]]
topic = "telefone"
level = "B1"
situation = "You're stuck in an automated phone menu and want a human."
say = "Posso falar com um atendente?"
short = "Um atendente, por favor."
polished = "Você poderia me transferir para um atendente, por favor?"
meaning = "Can I speak to an agent?"
accept = ["Quero falar com um atendente"]

# ---------------------------------------------------------------- health, A1 to B1

[[phrase]]
topic = "saúde"
level = "A1"
situation = "At the pharmacy, the assistant asks what's wrong."
say = "Estou com dor de garganta."
short = "Dor de garganta."
polished = "Estou com muita dor de garganta."
meaning = "I have a sore throat."
accept = ["Tô com dor de garganta", "Minha garganta está doendo"]
tip = "Portuguese is 'with' a pain: 'estou com dor de garganta', 'estou com dor nas costas'."

[[phrase]]
topic = "saúde"
level = "A1"
situation = "You can't stop coughing and go to the pharmacy."
say = "Preciso de algo pra tosse."
short = "Algo pra tosse?"
polished = "Você tem alguma coisa pra tosse forte?"
meaning = "I need something for a cough."
accept = ["Preciso de algo para tosse", "Preciso de um remédio pra tosse"]
tip = "'Pra' is the everyday spoken form of 'para'."

[[phrase]]
topic = "saúde"
level = "A1"
situation = "Before prescribing, the doctor asks if you have any allergies."
say = "Sou alérgico a penicilina."
short = "A penicilina."
polished = "Sim, sou alérgico a penicilina."
meaning = "I'm allergic to penicillin."
accept = ["Sou alérgica a penicilina", "Tenho alergia a penicilina"]
tip = "A woman says 'alérgica'."

[[phrase]]
topic = "saúde"
level = "A1"
situation = "You cut your finger cooking at a friend's place."
say = "Você tem um band-aid?"
polished = "Com licença, você tem um band-aid?"
meaning = "Do you have a band-aid?"
accept = ["Tem um band-aid?", "Você tem um curativo?"]
tip = "Brazilians say 'band-aid' too; the generic word is 'curativo'."

[[phrase]]
topic = "saúde"
level = "A1"
situation = "In the middle of dinner at a friend's place, you start to feel sick."
say = "Não estou me sentindo bem."
short = "Não estou bem."
polished = "Desculpa, não estou me sentindo muito bem."
meaning = "I'm not feeling well."
accept = ["Não tô me sentindo bem", "Não me sinto bem"]

[[phrase]]
topic = "saúde"
level = "A2"
situation = "You call the clinic first thing in the morning, without an appointment."
say = "Consigo passar com um médico hoje?"
short = "Um médico hoje?"
polished = "Será que eu consigo passar com um médico hoje?"
meaning = "Can I see a doctor today?"
accept = ["Eu consigo passar com um médico hoje?"]
tip = "'Passar com o médico' = to be seen by the doctor."

[[phrase]]
topic = "saúde"
level = "A2"
situation = "The doctor asks how long you've been in pain."
say = "Começou há dois dias."
short = "Há dois dias."
polished = "Começou há uns dois dias."
meaning = "It started two days ago."
accept = ["Começou faz dois dias"]
tip = "'Há dois dias' and 'faz dois dias' both mean two days ago."

[[phrase]]
topic = "saúde"
level = "A2"
situation = "You stand up too fast and everything starts spinning."
say = "Estou tonto."
polished = "Estou tonto desde hoje de manhã."
meaning = "I feel dizzy."
accept = ["Estou tonta", "Tô tonto", "Tô tonta"]
tip = "A woman says 'tonta'."

[[phrase]]
topic = "saúde"
level = "A2"
situation = "You landed badly playing soccer and your foot is swollen."
say = "Acho que torci o tornozelo."
short = "Torci o tornozelo."
polished = "Acho que eu torci o tornozelo jogando bola."
meaning = "I think I sprained my ankle."
accept = ["Acho que torci o pé"]

[[phrase]]
topic = "saúde"
level = "A2"
situation = "The pharmacist hands you the medicine and you don't know the dose."
say = "De quanto em quanto tempo eu tomo?"
short = "Quantas vezes por dia?"
polished = "Desculpa, de quanto em quanto tempo eu tomo?"
meaning = "How often should I take it?"
accept = ["De quanto em quanto tempo devo tomar?"]

[[phrase]]
topic = "saúde"
level = "A2"
situation = "The doctor asks if you take any medicine every day."
say = "Não tomo nenhum remédio."
short = "Nenhum remédio."
polished = "Não, não tomo nenhum remédio no momento."
meaning = "I'm not taking any medication."
accept = ["Não estou tomando nenhum remédio"]

[[phrase]]
topic = "saúde"
level = "B1"
situation = "Your regular medication ran out and you go to the doctor."
say = "Preciso renovar minha receita."
short = "Renovar minha receita."
polished = "Oi, preciso renovar minha receita, por favor."
meaning = "I need to renew my prescription."
accept = ["Preciso renovar a minha receita"]
tip = "'Receita' is both a prescription and a cooking recipe."

[[phrase]]
topic = "saúde"
level = "B1"
situation = "At the clinic's front desk, before an expensive test."
say = "Meu plano cobre isso?"
short = "O plano cobre?"
polished = "Você pode me dizer se meu plano cobre isso?"
meaning = "Does my insurance cover this?"
accept = ["O meu plano cobre isso?", "Meu convênio cobre isso?"]
tip = "'Plano' (de saúde) or 'convênio' is health insurance."

[[phrase]]
topic = "saúde"
level = "B1"
situation = "You call the dentist asking to be squeezed in urgently."
say = "Estou com muita dor de dente."
short = "Dor de dente."
polished = "Estou com muita dor de dente desde ontem à noite."
meaning = "I have a terrible toothache."
accept = ["Tô com muita dor de dente"]

# ---------------------------------------------------------------- emergency, A1 to B1

[[phrase]]
topic = "emergência"
level = "A1"
situation = "You see smoke coming out of the restaurant's kitchen."
say = "Está pegando fogo!"
polished = "Está pegando fogo, saiam todos!"
meaning = "There's a fire!"
accept = ["Tá pegando fogo"]
tip = "'Pegar fogo' = to catch fire."

[[phrase]]
topic = "emergência"
level = "A1"
situation = "You come out of the subway in a city you don't know and can't find your way back."
say = "Não acho meu hotel."
polished = "Com licença, não acho meu hotel."
meaning = "I can't find my hotel."
accept = ["Não encontro meu hotel", "Não consigo achar meu hotel"]

[[phrase]]
topic = "emergência"
level = "A1"
situation = "You get back to your table at the café and your backpack is gone."
say = "Roubaram minha mochila."
short = "Minha mochila!"
polished = "Com licença, acabaram de roubar minha mochila."
meaning = "Someone stole my backpack."
accept = ["Levaram minha mochila", "Roubaram a minha mochila"]
tip = "'Roubaram' = 'they stole'. Portuguese says 'they' when nobody knows who did it."

[[phrase]]
topic = "emergência"
level = "A1"
situation = "Someone collapses next to you on the street."
say = "Precisamos de um médico."
short = "Um médico!"
polished = "Precisamos de um médico aqui, rápido, por favor!"
meaning = "We need a doctor."
accept = ["A gente precisa de um médico"]

[[phrase]]
topic = "emergência"
level = "A1"
situation = "Your friend is hurt and you flag down a taxi."
say = "Preciso ir pra um hospital."
short = "Pro hospital, rápido!"
polished = "Por favor, preciso ir pra um hospital agora."
meaning = "I need to get to a hospital."
accept = ["Preciso ir para um hospital", "Preciso ir pro hospital"]

[[phrase]]
topic = "emergência"
level = "A2"
situation = "Your friend fell off his bike and can't get up."
say = "Meu amigo está machucado."
short = "Ele está machucado!"
polished = "Me ajuda, por favor, meu amigo está muito machucado."
meaning = "My friend is hurt."
accept = ["Minha amiga está machucada", "Meu amigo se machucou"]

[[phrase]]
topic = "emergência"
level = "A2"
situation = "You call emergency services and they ask where you are."
say = "Não sei o endereço."
short = "Não sei."
polished = "Desculpa, não sei o endereço exato."
meaning = "I don't know the address."
accept = ["Eu não sei o endereço"]

[[phrase]]
topic = "emergência"
level = "A2"
situation = "Your phone died and you need to let your family know."
say = "Posso usar seu celular?"
short = "Seu celular, por favor?"
polished = "Desculpa, posso usar seu celular um minutinho?"
meaning = "Can I use your phone?"
accept = ["Posso usar o seu celular?", "Me empresta seu celular?"]
tip = "'Celular' is a mobile phone."

[[phrase]]
topic = "emergência"
level = "A2"
situation = "The door slammed shut and your keys are inside the apartment."
say = "Fiquei trancado pra fora."
short = "Fiquei pra fora."
polished = "Fiquei trancado pra fora do meu apartamento."
meaning = "I'm locked out."
accept = ["Fiquei trancada pra fora", "Fiquei trancado para fora"]

[[phrase]]
topic = "emergência"
level = "A2"
situation = "After a minor car crash, you get out to check on people."
say = "Está todo mundo bem?"
short = "Todo mundo bem?"
polished = "Está todo mundo bem? Alguém se machucou?"
meaning = "Is everyone okay?"
accept = ["Tá todo mundo bem?"]
tip = "'Todo mundo' (the whole world) is how Brazilians say 'everyone'."

[[phrase]]
topic = "emergência"
level = "B1"
situation = "At the police station, after your backpack was taken."
say = "Preciso registrar um furto."
short = "Fui roubado."
polished = "Oi, eu gostaria de registrar um furto, por favor."
meaning = "I need to report a theft."
accept = ["Quero fazer um boletim de ocorrência", "Quero registrar um furto"]
tip = "The police report is a 'boletim de ocorrência', 'B.O.' for short."

[[phrase]]
topic = "emergência"
level = "B1"
situation = "Your card is missing and you call the bank."
say = "Preciso cancelar meu cartão."
short = "Cancela meu cartão."
polished = "Perdi meu cartão e preciso cancelar."
meaning = "I need to cancel my card."
accept = ["Preciso bloquear meu cartão", "Quero cancelar meu cartão"]

[[phrase]]
topic = "emergência"
level = "B1"
situation = "A man has passed out and you're on the phone with emergency services."
say = "Ele não está respirando."
short = "Não respira!"
polished = "Rápido, por favor, ele não está respirando!"
meaning = "He's not breathing."
accept = ["Ele não respira", "Ele não tá respirando"]

# ---------------------------------------------------------------- social, A1 to B1

[[phrase]]
topic = "social"
level = "A1"
situation = "You run into a neighbor in the elevator."
say = "E aí, tudo certo?"
polished = "E aí, tudo certo com você?"
meaning = "Hey, how's it going?"
accept = ["E aí, tudo bem?", "E aí, beleza?"]
tip = "'E aí?' is the casual hello among friends. A natural reply: 'Tudo certo, e você?'."

[[phrase]]
topic = "social"
level = "A1"
situation = "Your friend arrives at the party and you introduce her to a coworker."
say = "Essa é minha amiga Ana."
short = "Essa é a Ana."
polished = "Quero te apresentar minha amiga Ana."
meaning = "This is my friend Ana."
accept = ["Esta é minha amiga Ana", "Essa é a minha amiga Ana"]

[[phrase]]
topic = "social"
level = "A1"
situation = "The host offers you another drink and you don't want one."
say = "Estou bem assim, obrigado."
short = "Estou bem."
polished = "Estou bem assim por enquanto, obrigado."
meaning = "I'm good, thanks."
accept = ["Estou bem assim, obrigada", "Tô bem, obrigado", "Não, obrigado"]

[[phrase]]
topic = "social"
level = "A1"
situation = "You want to keep in touch with someone you met today."
say = "Qual é o seu número?"
short = "Seu número?"
polished = "Você me passa o seu número?"
meaning = "What's your number?"
accept = ["Qual o seu número?", "Me passa seu número?"]

[[phrase]]
topic = "social"
level = "A1"
situation = "A friend tells you she passed her driving test."
say = "Que notícia boa!"
short = "Que bom!"
polished = "Que notícia boa, fico muito feliz por você!"
meaning = "That's great news!"
accept = ["Que boa notícia!"]

[[phrase]]
topic = "social"
level = "A2"
situation = "You bump into an old classmate and want to catch up properly."
say = "Quer tomar um café?"
short = "Um café?"
polished = "Você quer tomar um café qualquer dia desses?"
meaning = "Do you want to grab a coffee?"
accept = ["Você quer tomar um café?", "Bora tomar um café?"]
tip = "Drinks are 'taken' in Portuguese: 'tomar um café', 'tomar uma cerveja'."

[[phrase]]
topic = "social"
level = "A2"
situation = "You're invited out tonight, but you already have plans."
say = "Hoje não vou conseguir ir."
short = "Hoje não dá."
polished = "Desculpa, hoje não vou conseguir ir."
meaning = "I can't make it today."
accept = ["Hoje eu não consigo ir", "Hoje não posso"]
tip = "'Não dá' = it won't work, I can't. Very common."

[[phrase]]
topic = "social"
level = "A2"
situation = "A friend tells you he lost his job."
say = "Que pena, sinto muito."
short = "Que pena."
polished = "Que pena, sinto muito por isso."
meaning = "I'm so sorry to hear that."
accept = ["Poxa, sinto muito", "Que chato, sinto muito"]

[[phrase]]
topic = "social"
level = "A2"
situation = "You arrive twenty minutes after the agreed time."
say = "Desculpa a demora."
short = "Desculpa!"
polished = "Desculpa a demora, o trânsito estava horrível."
meaning = "Sorry to keep you waiting."
accept = ["Desculpa o atraso", "Desculpe a demora"]

[[phrase]]
topic = "social"
level = "A2"
situation = "On Monday, a coworker asks how your weekend was."
say = "Nada demais, fiquei em casa."
short = "Nada demais."
polished = "Nada demais, só fiquei em casa descansando."
meaning = "Not much, I just stayed home."
accept = ["Nada demais, só fiquei em casa"]

[[phrase]]
topic = "social"
level = "A2"
situation = "Friday afternoon, you want to know your friend's plans."
say = "O que você vai fazer no fim de semana?"
short = "Algum plano?"
polished = "E aí, o que você vai fazer no fim de semana?"
meaning = "What are you up to this weekend?"
accept = ["O que você vai fazer no final de semana?"]

[[phrase]]
topic = "social"
level = "B1"
situation = "At a wedding, you sit next to a cousin you haven't seen in years."
say = "Faz tempo que a gente não se vê!"
short = "Faz tempo, hein?"
polished = "Faz tempo que a gente não se vê! Como você está?"
meaning = "It's been a long time!"
accept = ["Faz tempo que não nos vemos"]
tip = "'A gente' means 'we' in everyday speech, with a singular verb."

[[phrase]]
topic = "social"
level = "B1"
situation = "The conversation is good, but you have to leave."
say = "Preciso ir andando."
short = "Preciso ir."
polished = "Bom, preciso ir andando, mas foi ótimo falar com você."
meaning = "I should get going."
accept = ["Tenho que ir", "Já vou indo"]

[[phrase]]
topic = "social"
level = "B1"
situation = "Your friend insists on paying the bar tab again."
say = "A próxima é por minha conta."
short = "A próxima é minha."
polished = "Obrigado, mas a próxima é por minha conta."
meaning = "The next one is on me."
accept = ["A próxima eu pago", "Obrigada, mas a próxima é por minha conta"]
tip = "'Por minha conta' = on me, I'm paying."

# ---------------------------------------------------------------- shopping, A1 to B1

[[phrase]]
topic = "compras"
level = "A1"
situation = "You picked two pairs of pants and can't find where to try them on."
say = "Onde ficam os provadores?"
short = "Os provadores?"
polished = "Com licença, onde ficam os provadores?"
meaning = "Where are the fitting rooms?"
accept = ["Onde fica o provador?", "Cadê o provador?"]

[[phrase]]
topic = "compras"
level = "A1"
situation = "You come out of the fitting room and the assistant asks how the shirt fits."
say = "Ficou apertada."
polished = "Ficou um pouco apertada em mim."
meaning = "It's too tight."
accept = ["Ficou apertado", "Está apertada"]
tip = "'Ficou' is how you say how clothes fit: 'ficou bom', 'ficou grande'."

[[phrase]]
topic = "compras"
level = "A1"
situation = "At a market stall, you have no cash on you."
say = "Posso pagar com cartão?"
short = "Aceita cartão?"
polished = "Com licença, posso pagar com cartão?"
meaning = "Can I pay by card?"
accept = ["Passa cartão?", "Vocês aceitam cartão?"]

[[phrase]]
topic = "compras"
level = "A1"
situation = "It's late and you want to know if you have time to come back to the store."
say = "Que horas vocês fecham?"
short = "Fecham que horas?"
polished = "Com licença, que horas vocês fecham hoje?"
meaning = "What time do you close?"
accept = ["A que horas vocês fecham?"]

[[phrase]]
topic = "compras"
level = "A2"
situation = "There's a discount sign, but the tag shows the full price."
say = "Isso está em promoção?"
short = "Em promoção?"
polished = "Com licença, esse aqui está em promoção?"
meaning = "Is this on sale?"
accept = ["Está na promoção?", "Isso tá em promoção?"]

[[phrase]]
topic = "compras"
level = "A2"
situation = "The assistant asks if she can help, and you want something for your mother."
say = "Estou procurando um presente."
polished = "Estou procurando um presente pra minha mãe."
meaning = "I'm looking for a gift."
accept = ["Tô procurando um presente", "Procuro um presente"]

[[phrase]]
topic = "compras"
level = "A2"
situation = "You paid and the cashier didn't hand you the receipt."
say = "Pode me dar a nota?"
short = "A nota, por favor."
polished = "Você pode me dar a nota fiscal, por favor?"
meaning = "Can I have the receipt?"
accept = ["Pode me dar o recibo?", "Me dá a nota?"]
tip = "'Nota' (nota fiscal) is the store receipt."

[[phrase]]
topic = "compras"
level = "A2"
situation = "The sneakers are too big on you."
say = "Tem um número menor?"
short = "Um número menor?"
polished = "Por acaso tem um número menor?"
meaning = "Do you have a smaller size?"
accept = ["Tem um tamanho menor?"]
tip = "A shoe or clothing size is a 'número' or a 'tamanho'."

[[phrase]]
topic = "compras"
level = "B1"
situation = "You open the box in the store and the device's screen is scratched."
say = "Este aqui está com defeito."
short = "Está com defeito."
polished = "Desculpa, mas este aqui está com defeito."
meaning = "This one is damaged."
accept = ["Esse aqui está com defeito", "Esse veio com defeito"]

[[phrase]]
topic = "compras"
level = "B1"
situation = "You were given a sweater, but you don't like the color."
say = "Posso trocar por outra cor?"
short = "Posso trocar?"
polished = "Seria possível trocar por outra cor?"
meaning = "Can I exchange it for another color?"
accept = ["Dá pra trocar por outra cor?"]

[[phrase]]
topic = "compras"
level = "B1"
situation = "You ordered online two weeks ago and nothing has come."
say = "Meu pedido ainda não chegou."
short = "Meu pedido não chegou."
polished = "Desculpa, mas meu pedido ainda não chegou."
meaning = "My order hasn't arrived yet."
accept = ["O meu pedido ainda não chegou"]

[[phrase]]
topic = "compras"
level = "B1"
situation = "Before buying an expensive gift, you want to know if it can be returned."
say = "Qual é a política de troca?"
short = "Posso devolver?"
polished = "Você pode me dizer qual é a política de troca?"
meaning = "What's your return policy?"
accept = ["Qual a política de troca?", "Qual é a política de devolução?"]

[[phrase]]
topic = "compras"
level = "B1"
situation = "You check your statement and the same purchase shows up twice."
say = "Acho que me cobraram duas vezes."
short = "Me cobraram duas vezes."
polished = "Com licença, acho que me cobraram duas vezes por isso."
meaning = "I think I was charged twice."
