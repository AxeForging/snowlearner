# English for English speakers, overlaying decks/es.toml. Keyed by `say` (must match the deck exactly).
language = "es"
native = "en"
language_name = "Spanish"
title = "Spanish for real life"
default_cue = "Repeat: {}"

# ---------------------------------------------------------------- tips

[[tip]]
text = "False friend: 'embarazada' means PREGNANT, not embarrassed (avergonzado)."
[[tip]]
text = "False friend: 'constipado' means having a cold, not constipated (estreñido)."
[[tip]]
text = "False friend: 'éxito' means success. The way out is 'salida'."
[[tip]]
text = "False friend: 'librería' is a bookshop. A library is 'biblioteca'."
[[tip]]
text = "False friend: 'carpeta' is a folder. A carpet is 'alfombra'."
[[tip]]
text = "False friend: 'actual' means current. 'Actually' is 'en realidad'."
[[tip]]
text = "False friend: 'sensible' means sensitive. Sensible is 'sensato'."
[[tip]]
text = "False friend: 'asistir' means to attend. To assist is 'ayudar'."
[[tip]]
text = "Vowels: Spanish has five short, pure vowels. Never glide them: 'no' is not 'noh-oo'."
[[tip]]
text = "Pronunciation: 'rr' is a rolled r, and a single 'r' is a quick tap, like the 'tt' in 'butter'."
[[tip]]
text = "Pronunciation: 'j' (and 'g' before e/i) is a rough 'h' from the throat: 'jamón' = 'ha-MON'."
[[tip]]
text = "Pronunciation: 'h' is always silent: 'hola' = 'ola', 'hotel' = 'otel'."
[[tip]]
text = "Pronunciation: 'll' and 'y' sound like the 'y' in 'yes' in most places: 'calle' = 'ka-ye'."
[[tip]]
text = "Pronunciation: 'z' and 'c' before e/i sound like 'th' in Spain and like 's' in Latin America."
[[tip]]
text = "'Tú' is informal, 'usted' is formal. Use 'usted' with older people, officials and new clients."
[[tip]]
text = "In Spanish you 'have' hunger and cold: tengo hambre, tengo frío, tengo 30 años."
[[tip]]
text = "For weather, use 'hace': hace frío, hace calor, hace sol."
[[tip]]
text = "'Ser' is for what something is, 'estar' for where it is or how it is right now: estoy cansado."
[[tip]]
text = "Questions and exclamations open with an upside-down mark: ¿Qué tal? ¡Qué bien!"
[[tip]]
text = "Spanish often drops the subject: say 'Tengo una pregunta', not 'Yo tengo una pregunta'."

# ---------------------------------------------------------------- work

[[phrase]]
say = "Perdón, estás en silencio"
meaning = "Sorry, you're on mute"
situation = "Your coworker is talking, but they're on mute."

[[phrase]]
say = "¿Puedes compartir tu pantalla?"
meaning = "Can you share your screen?"
situation = "You want to see what your coworker is showing."

[[phrase]]
say = "Voy a llegar unos minutos tarde"
meaning = "I'm going to be a few minutes late"
situation = "You're running late for the meeting."

[[phrase]]
say = "Déjame revisarlo y te aviso"
meaning = "Let me check and I'll let you know"
situation = "You need to confirm something before you answer."

[[phrase]]
say = "¿Me lo puedes explicar paso a paso?"
meaning = "Can you explain it to me step by step?"
situation = "You didn't understand the explanation."

[[phrase]]
say = "¿Cuál es la fecha de entrega?"
meaning = "What's the deadline?"
situation = "You're asked about the deadline for a task."

[[phrase]]
say = "¿Podemos pasarlo para mañana?"
meaning = "Can we move it to tomorrow?"
situation = "The meeting needs to be pushed back."

[[phrase]]
say = "Tiene sentido"
meaning = "That makes sense"
situation = "You agree with the idea."

[[phrase]]
say = "Creo que hay un error en producción"
meaning = "I think there's a bug in production"
situation = "You found a serious problem in production."

[[phrase]]
say = "Te mando un correo con el resumen"
meaning = "I'll send you an email with the summary"
situation = "You'll send a summary after the meeting."
tip = "Email in Spanish is 'correo' (or just 'mail' in casual talk)."

[[phrase]]
say = "¿Me escuchas bien?"
meaning = "Can you hear me okay?"
situation = "You want to check that your audio is fine."

[[phrase]]
say = "Entiendo, pero no estoy seguro de que funcione"
meaning = "I see, but I'm not sure it will work"
situation = "You disagree, but politely."

