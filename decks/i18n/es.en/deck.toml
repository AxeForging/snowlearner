# English for English speakers, overlaying decks/es/, one file per theme. Keyed by `say` (must match the deck exactly).
language = "es"
native = "en"
language_name = "Spanish"
title = "Spanish for real life"
default_cue = "Repeat: {}"


[[tip]]
text = "False friend: 'embarazada' means PREGNANT, not embarrassed (avergonzado)."
[[tip]]
text = "False friend: 'constipado' means having a cold, not constipated (estreñido)."
[[tip]]
text = "False friend: 'éxito' means success. The way out is 'salida'."
[[tip]]
text = "False friend: 'librería' is a bookshop. A library is 'biblioteca'."
[[tip]]
text = "False friend: 'carpeta' is a folder. A carpet is 'alfombra'."
[[tip]]
text = "False friend: 'actual' means current. 'Actually' is 'en realidad'."
[[tip]]
text = "False friend: 'sensible' means sensitive. Sensible is 'sensato'."
[[tip]]
text = "False friend: 'asistir' means to attend. To assist is 'ayudar'."
[[tip]]
text = "Vowels: Spanish has five short, pure vowels. Never glide them: 'no' is not 'noh-oo'."
[[tip]]
text = "Pronunciation: 'rr' is a rolled r, and a single 'r' is a quick tap, like the 'tt' in 'butter'."
[[tip]]
text = "Pronunciation: 'j' (and 'g' before e/i) is a rough 'h' from the throat: 'jamón' = 'ha-MON'."
[[tip]]
text = "Pronunciation: 'h' is always silent: 'hola' = 'ola', 'hotel' = 'otel'."
[[tip]]
text = "Pronunciation: 'll' and 'y' sound like the 'y' in 'yes' in most places: 'calle' = 'ka-ye'."
[[tip]]
text = "Pronunciation: 'z' and 'c' before e/i sound like 'th' in Spain and like 's' in Latin America."
[[tip]]
text = "'Tú' is informal, 'usted' is formal. Use 'usted' with older people, officials and new clients."
[[tip]]
text = "In Spanish you 'have' hunger and cold: tengo hambre, tengo frío, tengo 30 años."
[[tip]]
text = "For weather, use 'hace': hace frío, hace calor, hace sol."
[[tip]]
text = "'Ser' is for what something is, 'estar' for where it is or how it is right now: estoy cansado."
[[tip]]
text = "Questions and exclamations open with an upside-down mark: ¿Qué tal? ¡Qué bien!"
[[tip]]
text = "Spanish often drops the subject: say 'Tengo una pregunta', not 'Yo tengo una pregunta'."
