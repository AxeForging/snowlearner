# decks/es: trabalho. The header and tips are in deck.toml; src/learn/deck.rs joins the files.

[[phrase]]
topic = "trabalho"
situation = "O colega está falando, mas está no mudo."
say = "Perdón, estás en silencio"
short = "Estás en silencio"
polished = "Perdón, creo que tienes el micrófono en silencio"
meaning = "Desculpa, você está no mudo"
accept = ["Estás en silencio", "Tienes el micrófono apagado"]

[[phrase]]
topic = "trabalho"
situation = "Você quer ver o que o colega está mostrando."
say = "¿Puedes compartir tu pantalla?"
short = "¿Compartes pantalla?"
polished = "¿Te importaría compartir tu pantalla?"
meaning = "Pode compartilhar sua tela?"
accept = ["¿Podrías compartir tu pantalla?"]

[[phrase]]
topic = "trabalho"
situation = "Você vai se atrasar para a reunião."
say = "Voy a llegar unos minutos tarde"
short = "Llego tarde"
polished = "Perdón, voy a llegar unos minutos tarde"
meaning = "Vou chegar alguns minutos atrasado"

[[phrase]]
topic = "trabalho"
situation = "Precisa confirmar antes de responder."
say = "Déjame revisarlo y te aviso"
short = "Lo reviso"
polished = "Déjame revisarlo bien y te aviso en un rato"
meaning = "Deixa eu revisar e te aviso"
accept = ["Lo reviso y te aviso"]

[[phrase]]
topic = "trabalho"
situation = "Não entendeu a explicação."
say = "¿Me lo puedes explicar paso a paso?"
short = "¿Me lo explicas?"
polished = "¿Te importaría explicármelo paso a paso, por favor?"
meaning = "Você pode me explicar passo a passo?"

[[phrase]]
topic = "trabalho"
situation = "Perguntam o prazo de uma tarefa."
say = "¿Cuál es la fecha de entrega?"
short = "¿Para cuándo es?"
polished = "¿Me podrías decir cuál es la fecha de entrega?"
meaning = "Qual é o prazo de entrega?"

[[phrase]]
topic = "trabalho"
situation = "A reunião precisa ser adiada."
say = "¿Podemos pasarlo para mañana?"
short = "¿Mañana mejor?"
polished = "¿Sería posible pasarlo para mañana?"
meaning = "Podemos passar isso pra amanhã?"
accept = ["¿Lo podemos pasar para mañana?"]

[[phrase]]
topic = "trabalho"
situation = "Você concorda com a ideia."
say = "Tiene sentido"
polished = "Sí, tiene todo el sentido"
meaning = "Faz sentido"

[[phrase]]
topic = "trabalho"
situation = "Achou um problema sério em produção."
say = "Creo que hay un error en producción"
short = "Hay un error"
polished = "Creo que puede haber un error en producción"
meaning = "Acho que tem um erro em produção"

[[phrase]]
topic = "trabalho"
situation = "Vai mandar um resumo depois da reunião."
say = "Te mando un correo con el resumen"
short = "Te mando el resumen"
polished = "Luego te mando un correo con el resumen"
meaning = "Te mando um email com o resumo"
tip = "Email em espanhol é 'correo' (ou 'mail' na conversa)."

[[phrase]]
topic = "trabalho"
situation = "Quer saber se o áudio está bom."
say = "¿Me escuchas bien?"
short = "¿Me escuchas?"
polished = "Perdón, ¿me escuchas bien?"
meaning = "Você está me ouvindo bem?"
accept = ["¿Me oyes bien?"]

[[phrase]]
topic = "trabalho"
situation = "Discorda, mas com educação."
say = "Entiendo, pero no estoy seguro de que funcione"
short = "No estoy seguro"
polished = "Entiendo tu punto, pero no estoy del todo seguro de que funcione"
meaning = "Entendo, mas não tenho certeza de que funcione"

[[phrase]]
topic = "trabalho"
level = "A1"
situation = "Seu celular toca durante a reunião e você atende rapidinho pra avisar."
say = "Estoy en una reunión."
polished = "Perdón, ahora estoy en una reunión."
meaning = "Estou numa reunião."
accept = ["Estoy en reunión"]

[[phrase]]
topic = "trabalho"
level = "A1"
situation = "Um colega chega na sua mesa enquanto você está numa ligação."
say = "Estoy en una llamada."
short = "En una llamada."
polished = "Perdona, ahora mismo estoy en una llamada."
meaning = "Estou numa ligação."
accept = ["Estoy al teléfono"]

[[phrase]]
topic = "trabalho"
level = "A1"
situation = "Na festa da empresa, alguém de outra área pergunta o que você faz."
say = "Trabajo en informática."
short = "En informática."
polished = "Trabajo en informática, en el equipo de software."
meaning = "Trabalho com TI."
accept = ["Trabajo en tecnología", "Trabajo en sistemas"]

[[phrase]]
topic = "trabalho"
level = "A1"
situation = "Um colega pergunta a que horas é a reunião de hoje."
say = "La reunión es a las diez."
short = "A las diez."
polished = "La reunión es a las diez, en la sala grande."
meaning = "A reunião é às dez."
accept = ["Es a las diez"]

[[phrase]]
topic = "trabalho"
level = "A1"
situation = "Primeiro dia no escritório, você procura onde vai ser a reunião."
say = "¿Dónde está la sala de reuniones?"
short = "¿La sala de reuniones?"
polished = "Disculpa, ¿me podrías decir dónde está la sala de reuniones?"
meaning = "Onde fica a sala de reunião?"
accept = ["¿Dónde es la sala de reuniones?"]

[[phrase]]
topic = "trabalho"
level = "A1"
situation = "Na call, o cliente falou rápido e você não pegou o número do pedido."
say = "¿Puede repetir, por favor?"
short = "¿Cómo?"
polished = "Perdón, ¿lo puede repetir, por favor?"
meaning = "Pode repetir, por favor?"
accept = ["¿Puedes repetir, por favor?"]

[[phrase]]
topic = "trabalho"
level = "A1"
situation = "Um cliente chega e você apresenta a pessoa que coordena o seu time."
say = "Este es mi jefe."
short = "Mi jefe."
polished = "Le presento a mi jefe."
meaning = "Esse é o meu gerente."
accept = ["Esta es mi jefa"]

[[phrase]]
topic = "trabalho"
level = "A1"
situation = "No fim da apresentação, perguntam se alguém tem dúvidas, e você tem."
say = "Tengo una pregunta."
short = "Una pregunta."
polished = "Perdón, tengo una pregunta, si me permiten."
meaning = "Tenho uma pergunta."
accept = ["Tengo una duda"]

[[phrase]]
topic = "trabalho"
level = "A1"
situation = "Você acorda com febre e avisa o time no chat que não vai trabalhar."
say = "Hoy estoy enfermo."
short = "Estoy enfermo."
polished = "Hola a todos, hoy estoy enfermo y no voy a trabajar."
meaning = "Estou doente hoje."
accept = ["Hoy estoy enferma", "Estoy enfermo hoy"]

[[phrase]]
topic = "trabalho"
level = "A1"
situation = "Um colega passou meia hora te ajudando a configurar o notebook."
say = "Gracias por tu ayuda."
short = "Gracias."
polished = "Muchas gracias por toda tu ayuda."
meaning = "Obrigado pela ajuda."
accept = ["Gracias por su ayuda"]

[[phrase]]
topic = "trabalho"
level = "A1"
situation = "Sexta à tarde, você sai do escritório e se despede do time."
say = "Nos vemos el lunes."
short = "Hasta el lunes."
polished = "Buen fin de semana, nos vemos el lunes."
meaning = "Até segunda."
accept = ["Hasta el lunes"]

[[phrase]]
topic = "trabalho"
level = "A2"
situation = "Um colega quer conversar, mas você está no meio de uma entrega."
say = "¿Hablamos después del almuerzo?"
polished = "¿Te parece si hablamos después del almuerzo?"
meaning = "Podemos conversar depois do almoço?"
accept = ["¿Podemos hablar después de comer?"]

[[phrase]]
topic = "trabalho"
level = "A2"
situation = "O cliente pergunta quando vai receber a proposta."
say = "Hoy te mando el correo."
short = "Hoy te lo mando."
polished = "Le mando el correo hoy antes de que termine el día."
meaning = "Mando o e-mail hoje."
accept = ["Te envío el correo hoy"]

[[phrase]]
topic = "trabalho"
level = "A2"
situation = "Um colega pergunta se você vai ao escritório hoje."
say = "Hoy trabajo desde casa."
short = "Teletrabajo hoy."
polished = "Hoy trabajo desde casa, pero estoy conectado si me necesitas."
meaning = "Hoje estou trabalhando de casa."
accept = ["Hoy trabajo en remoto"]

[[phrase]]
topic = "trabalho"
level = "A2"
situation = "A reunião já começou e você não acha o convite na agenda."
say = "¿Me mandas el enlace?"
short = "¿El enlace?"
polished = "¿Me podrías mandar el enlace, por favor?"
meaning = "Pode me mandar o link?"
accept = ["¿Me puedes enviar el enlace?"]

[[phrase]]
topic = "trabalho"
level = "A2"
situation = "Você entra atrasado na call e explica o motivo."
say = "No me funciona internet."
short = "Sin internet."
polished = "Perdón por el retraso, no me funciona internet."
meaning = "Minha internet caiu."
accept = ["Se me cayó internet"]

[[phrase]]
topic = "trabalho"
level = "A2"
situation = "Na call, o som do colega some de repente."
say = "No te oigo."
polished = "Perdón, no te oigo muy bien."
meaning = "Não estou te ouvindo."
accept = ["No te escucho", "No lo escucho"]

[[phrase]]
topic = "trabalho"
level = "A2"
situation = "Você avisa um colega que a reunião de quarta mudou de dia."
say = "La reunión se movió al viernes."
short = "Pasó al viernes."
polished = "Te aviso de que la reunión se movió al viernes."
meaning = "A reunião mudou pra sexta."
accept = ["Cambiaron la reunión al viernes"]

[[phrase]]
topic = "trabalho"
level = "A2"
situation = "O trânsito parou e você avisa no chat que vai chegar atrasado."
say = "Llego cinco minutos tarde."
polished = "Perdón, llego unos cinco minutos tarde."
meaning = "Vou atrasar cinco minutos."
accept = ["Voy a llegar cinco minutos tarde"]

[[phrase]]
topic = "trabalho"
level = "A2"
situation = "Você quer marcar uma conversa com um cliente e pergunta o melhor horário."
say = "¿A qué hora te viene bien?"
short = "¿Cuándo puedes?"
polished = "¿A qué hora te vendría mejor?"
meaning = "Que horário fica bom pra você?"
accept = ["¿Qué hora te queda bien?"]

[[phrase]]
topic = "trabalho"
level = "A2"
situation = "O chefe pergunta como está o relatório do mês."
say = "Terminé el informe."
short = "Informe listo."
polished = "Terminé el informe, ahora mismo se lo envío."
meaning = "Terminei o relatório."
accept = ["Ya terminé el informe"]

[[phrase]]
topic = "trabalho"
level = "A2"
situation = "Você combina com um colega de revisar o projeto juntos."
say = "Nos vemos mañana a las nueve."
short = "Mañana a las nueve."
polished = "¿Te parece si nos vemos mañana a las nueve?"
meaning = "Vamos nos ver amanhã às nove."
accept = ["Quedamos mañana a las nueve"]
