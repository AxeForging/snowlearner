# decks/es: restaurante. The header and tips are in deck.toml; src/learn/deck.rs joins the files.

[[phrase]]
topic = "restaurante"
situation = "Terminou de comer e quer pagar."
say = "La cuenta, por favor"
polished = "Cuando pueda, ¿nos trae la cuenta, por favor?"
meaning = "A conta, por favor"
accept = ["¿Me trae la cuenta, por favor?"]

[[phrase]]
topic = "restaurante"
situation = "Quer levar a comida."
say = "¿Me lo pone para llevar?"
short = "Para llevar"
polished = "¿Me lo pone para llevar, por favor?"
meaning = "Pode embalar pra viagem?"
accept = ["Para llevar, por favor"]

[[phrase]]
topic = "restaurante"
situation = "Tem alergia a nozes."
say = "Soy alérgico a los frutos secos"
short = "Sin frutos secos"
polished = "Para que lo sepa, soy alérgico a los frutos secos"
meaning = "Sou alérgico a nozes e castanhas"

[[phrase]]
topic = "restaurante"
situation = "Não sabe o que pedir."
say = "¿Qué me recomienda?"
polished = "¿Qué me recomendaría usted?"
meaning = "O que você me recomenda?"
accept = ["¿Qué me recomiendas?"]

[[phrase]]
topic = "restaurante"
situation = "Chegou com um amigo."
say = "Una mesa para dos, por favor"
short = "Para dos"
polished = "Buenas, ¿tiene una mesa para dos, por favor?"
meaning = "Uma mesa pra dois, por favor"

[[phrase]]
topic = "restaurante"
situation = "Quer saber se aceitam cartão."
say = "¿Aceptan tarjeta?"
polished = "¿Se puede pagar con tarjeta?"
meaning = "Vocês aceitam cartão?"
accept = ["¿Se puede pagar con tarjeta?"]
