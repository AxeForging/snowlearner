polished = "Bom dia, pessoal. Tudo bem?"
meaning = "Good morning, everyone."
accept = ["Bom dia, gente", "Bom dia a todos"]

[[phrase]]
topic = "trabalho"
level = "PRE-A1"
situation = "First day at the office, and your laptop has no internet."
say = "Senha do wi-fi?"
polished = "Qual é a senha do wi-fi?"
meaning = "Wi-Fi password?"
accept = ["A senha do wi-fi?"]

[[phrase]]
topic = "trabalho"
level = "PRE-A1"
situation = "On the call, your manager asks if you can hear them."
say = "Estou aqui."
polished = "Sim, estou aqui. Estou te ouvindo."
meaning = "I'm here."
accept = ["Tô aqui"]

[[phrase]]
topic = "trabalho"
level = "PRE-A1"
situation = "Your team lead asks if you can finish the task today."
say = "Consigo, sim."
polished = "Consigo, sim, termino hoje."
meaning = "Yes, I can."
accept = ["Consigo", "Sim, consigo"]
tip = "Answer with the verb itself: 'consigo' means 'I can (manage)'."

[[phrase]]
topic = "trabalho"
level = "A1"
situation = "The connection dropped for a moment during the call and you missed the question."
