# Hand-curated beginner deck for English speakers: first Brazilian Portuguese words, then short chunks. Real situations only.
language = "pt-BR"
native = "en"
language_name = "Portuguese"
title = "First steps"

# ---------------------------------------------------------------- first words

[[phrase]]
topic = "primeiros contatos"
