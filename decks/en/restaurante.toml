# decks/en: restaurante. The header and tips are in deck.toml; src/learn/deck.rs joins the files.

[[phrase]]
topic = "restaurante"
situation = "Você quer levar a comida pra viagem."
say = "Can I get this to go?"
short = "To go, please"
polished = "Could I get this to go, please?"
meaning = "Pode embalar pra viagem?"
accept = ["Could I get this to go?"]

[[phrase]]
topic = "restaurante"
situation = "Você tem alergia a amendoim."
say = "I'm allergic to peanuts"
short = "No peanuts, please"
polished = "Just so you know, I'm allergic to peanuts"
meaning = "Sou alérgico a amendoim"
tip = "Alergia é sério: fale devagar e aponte no cardápio se precisar."

[[phrase]]
topic = "restaurante"
situation = "Terminou de comer e quer pagar."
say = "Could we get the check, please?"
short = "Check, please"
polished = "Whenever you're ready, could we get the check, please?"
meaning = "Pode trazer a conta, por favor?"
accept = ["Can we get the check, please?", "Check, please"]
tip = "Nos EUA é 'check'; no Reino Unido, 'bill'."

[[phrase]]
topic = "restaurante"
situation = "Chegou no restaurante com um amigo."
say = "A table for two, please"
short = "Two, please"
polished = "Hi, could we get a table for two, please?"
meaning = "Uma mesa pra dois, por favor"

[[phrase]]
topic = "restaurante"
situation = "Não sabe o que pedir."
say = "What do you recommend?"
short = "Any recommendations?"
polished = "What would you recommend here?"
meaning = "O que você recomenda?"

[[phrase]]
topic = "restaurante"
situation = "Quer saber se aceitam cartão."
say = "Do you take credit cards?"
short = "Card okay?"
polished = "Do you happen to take credit cards?"
meaning = "Vocês aceitam cartão de crédito?"
accept = ["Do you accept credit cards?"]
