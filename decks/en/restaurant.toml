# decks/en: restaurante. The header and tips are in deck.toml; src/learn/deck.rs joins the files.

[[phrase]]
topic = "restaurante"
level = "A2"
situation = "Você quer levar a comida pra viagem."
say = "Can I get this to go?"
short = "To go, please"
polished = "Could I get this to go, please?"
meaning = "Pode embalar pra viagem?"
accept = ["Could I get this to go?"]

[[phrase]]
topic = "restaurante"
level = "A1"
situation = "Você tem alergia a amendoim."
say = "I'm allergic to peanuts"
short = "No peanuts, please"
polished = "Just so you know, I'm allergic to peanuts"
meaning = "Sou alérgico a amendoim"
accept = ["I have a peanut allergy"]
tip = "Em inglês você 'é' alérgico: 'I'm allergic to...', não 'I have allergy'. Com o substantivo vai o 'a': 'I have a peanut allergy'."

[[phrase]]
topic = "restaurante"
level = "A2"
situation = "Terminou de comer e quer pagar."
say = "Could we get the check, please?"
short = "Check, please"
polished = "Whenever you're ready, could we get the check, please?"
meaning = "Pode trazer a conta, por favor?"
accept = ["Can we get the check, please?", "Check, please"]
tip = "Nos EUA é 'check'; no Reino Unido, 'bill'."

[[phrase]]
topic = "restaurante"
level = "A1"
situation = "Chegou no restaurante com um amigo."
say = "A table for two, please"
short = "Two, please"
polished = "Hi, could we get a table for two, please?"
meaning = "Uma mesa pra dois, por favor"

[[phrase]]
topic = "restaurante"
level = "A1"
situation = "Não sabe o que pedir."
say = "What do you recommend?"
short = "Any recommendations?"
polished = "What would you recommend here?"
meaning = "O que você recomenda?"

[[phrase]]
topic = "restaurante"
level = "A2"
situation = "Quer saber se aceitam cartão."
say = "Do you take credit cards?"
short = "Do you take cards?"
polished = "Do you happen to take credit cards?"
meaning = "Vocês aceitam cartão de crédito?"
accept = ["Do you accept credit cards?"]

[[phrase]]
topic = "restaurante"
level = "A2"
situation = "O garçom chega à mesa com o bloquinho na mão."
say = "I'll have the chicken, please."
short = "The chicken, please."
polished = "I think I'll have the chicken, please."
meaning = "Vou querer o frango, por favor."
accept = ["I will have the chicken, please", "I'll have the chicken"]
tip = "'I'll have...' é o jeito natural de pedir. 'I want...' soa seco."

[[phrase]]
topic = "restaurante"
level = "A2"
situation = "Vocês sentaram há dez minutos e ninguém trouxe o cardápio."
say = "Could we see the menu?"
short = "The menu, please."
polished = "Excuse me, could we see the menu, please?"
meaning = "Podemos ver o cardápio?"
accept = ["Can we see the menu?", "Could we have the menu?"]

[[phrase]]
topic = "restaurante"
level = "A2"
situation = "Você não aguenta pimenta e o prato tem um desenho de chama ao lado."
say = "Is this dish spicy?"
short = "Is it spicy?"
polished = "Excuse me, is this dish very spicy?"
meaning = "Esse prato é apimentado?"
accept = ["Is this spicy?"]
tip = "'Spicy' é apimentado. 'Hot' pode ser quente ou apimentado."

[[phrase]]
topic = "restaurante"
level = "A2"
situation = "A comida chegou, mas esqueceram a sua bebida."
say = "Can I have some water, please?"
short = "Some water, please."
polished = "Could I have some water, please?"
meaning = "Pode me trazer uma água, por favor?"
accept = ["Can I get some water, please?", "Could I get some water, please?"]

[[phrase]]
topic = "restaurante"
level = "A2"
situation = "O garçom tira os pratos e pergunta se estava tudo bom."
say = "Everything was delicious."
short = "It was delicious."
polished = "Everything was delicious, thank you so much."
meaning = "Estava tudo delicioso."
accept = ["It was all delicious", "Everything was great"]

[[phrase]]
topic = "restaurante"
level = "B2"
situation = "Seu bife chegou bem passado, mas você pediu mal passado."
say = "I think there's been a mix-up, I ordered it rare."
short = "I ordered it rare."
polished = "Sorry, I think there's been a mix-up, I ordered mine rare."
meaning = "Acho que houve uma confusão, eu pedi mal passado."
accept = ["I think there's been a mistake, I ordered it rare."]
tip = "'Rare' aqui não é raro: é mal passado. Ao ponto é 'medium'; bem passado, 'well done'."

[[phrase]]
topic = "restaurante"
level = "B2"
situation = "Você não pode comer laticínio e o prato vem com um molho cremoso."
say = "Could you check whether the sauce has any dairy in it?"
short = "Does the sauce have dairy?"
polished = "Would you mind checking with the kitchen whether the sauce has any dairy in it?"
meaning = "Você pode verificar se o molho tem algum laticínio?"
accept = ["Could you find out if the sauce has any dairy?", "Could you check if the sauce has any dairy in it?"]
tip = "'Dairy' (déri) é laticínio; não confunda com 'diary' (dáiari), que é diário."

[[phrase]]
topic = "restaurante"
level = "B2"
situation = "Faz quarenta minutos que vocês pediram e a mesa que chegou depois já está comendo."
say = "Our food seems to be taking a while, could you check on it?"
short = "Could you check on our food?"
polished = "Sorry to bother you, but our food seems to be taking a while, could you check on it?"
meaning = "Nossa comida parece estar demorando, você pode dar uma olhada?"
accept = ["We ordered quite a while ago, could you check on our food?", "We ordered a while ago, could you check on our order?"]

[[phrase]]
topic = "restaurante"
level = "B2"
situation = "Você reservou mesa pra quatro, mas dois amigos resolveram vir de última hora."
say = "Is there any chance you could fit two more people in?"
short = "Can you fit two more?"
polished = "I know it's short notice, but is there any chance you could fit two more in?"
meaning = "Tem alguma chance de vocês encaixarem mais duas pessoas?"
accept = ["Any chance you could squeeze in two more people?"]
tip = "'Short notice' = em cima da hora. 'Notice' é aviso, não notícia (que é 'news')."
