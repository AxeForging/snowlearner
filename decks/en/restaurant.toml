# decks/en: restaurante. The header and tips are in deck.toml; src/learn/deck.rs joins the files.

[[phrase]]
topic = "restaurante"
level = "B1"
situation = "O garçom volta pela terceira vez e vocês ainda não escolheram o prato."
say = "We haven't decided yet, could we have a few more minutes?"
short = "We need a minute."
polished = "Sorry, we haven't quite decided yet, could we have a few more minutes?"
meaning = "Ainda não decidimos, pode nos dar mais uns minutinhos?"
accept = ["We haven't decided yet, can we have a few more minutes?", "We're still deciding, could we have a few more minutes?"]
tip = "'Ainda não decidimos' vira 'We haven't decided yet', com 'yet' no fim. 'We didn't decide yet' soa errado."

[[phrase]]
topic = "restaurante"
level = "B1"
situation = "Vocês sentaram do lado da caixa de som e mal conseguem conversar."
say = "Would you mind if we moved to a quieter table?"
short = "Could we move tables?"
polished = "Sorry, would you mind if we moved to a quieter table?"
meaning = "Você se importa se a gente mudar pra uma mesa mais tranquila?"
accept = ["Do you mind if we move to a quieter table?", "Would it be okay if we moved to a quieter table?"]
tip = "Depois de 'Would you mind if' vem o passado, 'if we moved', como no português 'se a gente mudasse'."

[[phrase]]
topic = "restaurante"
level = "B1"
situation = "O garçom pergunta o que você vai querer, e um amigo te disse que o bife daqui é ótimo."
say = "I've heard great things about the steak here."
short = "I've heard the steak's good."
polished = "I've heard great things about the steak here, I'll have that, please."
meaning = "Ouvi falar muito bem do bife daqui."
accept = ["I've heard the steak here is really good.", "I've heard the steak here is great."]
tip = "'Steak' rima com 'make' (stêik), não com 'speak'."

[[phrase]]
topic = "restaurante"
level = "B1"
situation = "Você comeu demais e o garçom oferece a sobremesa."
say = "I'm full, I couldn't eat another bite."
short = "I'm stuffed."
polished = "No, thank you, it was lovely, but I couldn't eat another bite."
meaning = "Estou satisfeito, não consigo comer mais nada."
accept = ["I'm stuffed, I couldn't eat another bite.", "I couldn't eat another thing."]
tip = "'Estou satisfeito' é 'I'm full'. 'I'm satisfied' soa como 'estou contente com o serviço'."

[[phrase]]
topic = "restaurante"
level = "B1"
situation = "O garçom sugere um vinho, mas você vai dirigir depois do jantar."
say = "I'd rather stick to water, I'm driving."
short = "Just water for me."
polished = "Thanks, but I'd rather stick to water, I'm driving tonight."
meaning = "Prefiro ficar na água, vou dirigir."
accept = ["I'll stick to water, I'm driving."]

[[phrase]]
topic = "restaurante"
level = "A2"
situation = "Você quer levar a comida pra viagem."
say = "Can I get this to go?"
short = "To go, please"
polished = "Could I get this to go, please?"
meaning = "Pode embalar pra viagem?"
accept = ["Could I get this to go?"]

[[phrase]]
topic = "restaurante"
level = "A1"
situation = "Você tem alergia a amendoim."
say = "I'm allergic to peanuts"
short = "No peanuts, please"
polished = "Just so you know, I'm allergic to peanuts"
meaning = "Sou alérgico a amendoim"
accept = ["I have a peanut allergy"]
tip = "Em inglês você 'é' alérgico: 'I'm allergic to...', não 'I have allergy'. Com o substantivo vai o 'a': 'I have a peanut allergy'."

[[phrase]]
topic = "restaurante"
level = "A2"
situation = "Terminou de comer e quer pagar."
say = "Could we get the check, please?"
short = "Check, please"
polished = "Whenever you're ready, could we get the check, please?"
meaning = "Pode trazer a conta, por favor?"
accept = ["Can we get the check, please?", "Check, please"]
tip = "Nos EUA é 'check'; no Reino Unido, 'bill'."

[[phrase]]
topic = "restaurante"
level = "A1"
situation = "Chegou no restaurante com um amigo."
say = "A table for two, please"
short = "Two, please"
polished = "Hi, could we get a table for two, please?"
meaning = "Uma mesa pra dois, por favor"

[[phrase]]
topic = "restaurante"
level = "A1"
situation = "Não sabe o que pedir."
say = "What do you recommend?"
short = "Any recommendations?"
polished = "What would you recommend here?"
meaning = "O que você recomenda?"

[[phrase]]
topic = "restaurante"
level = "A2"
situation = "Quer saber se aceitam cartão."
say = "Do you take credit cards?"
short = "Do you take cards?"
polished = "Do you happen to take credit cards?"
meaning = "Vocês aceitam cartão de crédito?"
accept = ["Do you accept credit cards?"]

[[phrase]]
topic = "restaurante"
level = "A2"
situation = "O garçom chega à mesa com o bloquinho na mão."
say = "I'll have the chicken, please."
short = "The chicken, please."
polished = "I think I'll have the chicken, please."
meaning = "Vou querer o frango, por favor."
accept = ["I will have the chicken, please", "I'll have the chicken"]
tip = "'I'll have...' é o jeito natural de pedir. 'I want...' soa seco."

[[phrase]]
topic = "restaurante"
level = "A2"
situation = "Vocês sentaram há dez minutos e ninguém trouxe o cardápio."
say = "Could we see the menu?"
short = "The menu, please."
polished = "Excuse me, could we see the menu, please?"
meaning = "Podemos ver o cardápio?"
accept = ["Can we see the menu?", "Could we have the menu?"]

[[phrase]]
topic = "restaurante"
level = "A2"
situation = "Você não aguenta pimenta e o prato tem um desenho de chama ao lado."
say = "Is this dish spicy?"
short = "Is it spicy?"
polished = "Excuse me, is this dish very spicy?"
meaning = "Esse prato é apimentado?"
accept = ["Is this spicy?"]
tip = "'Spicy' é apimentado. 'Hot' pode ser quente ou apimentado."

[[phrase]]
topic = "restaurante"
level = "A2"
situation = "A comida chegou, mas esqueceram a sua bebida."
say = "Can I have some water, please?"
short = "Some water, please."
polished = "Could I have some water, please?"
meaning = "Pode me trazer uma água, por favor?"
accept = ["Can I get some water, please?", "Could I get some water, please?"]

[[phrase]]
topic = "restaurante"
level = "A2"
situation = "O garçom tira os pratos e pergunta se estava tudo bom."
say = "Everything was delicious."
short = "It was delicious."
polished = "Everything was delicious, thank you so much."
meaning = "Estava tudo delicioso."
accept = ["It was all delicious", "Everything was great"]
