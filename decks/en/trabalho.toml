# decks/en: trabalho. The header and tips are in deck.toml; src/learn/deck.rs joins the files.

[[phrase]]
topic = "trabalho"
situation = "O colega está falando, mas está no mudo."
say = "Sorry, you're on mute"
short = "You're muted"
polished = "Sorry, I think you might be on mute"
meaning = "Desculpa, você está no mudo"
accept = ["You're on mute"]

[[phrase]]
topic = "trabalho"
situation = "Você quer ver o que o colega está mostrando."
say = "Can you share your screen?"
short = "Share your screen?"
polished = "Would you mind sharing your screen?"
meaning = "Pode compartilhar sua tela?"
accept = ["Could you share your screen?"]

[[phrase]]
topic = "trabalho"
situation = "Você vai se atrasar para a daily."
say = "I'm running a few minutes late"
short = "Running late!"
polished = "Sorry, I'm running a few minutes late"
meaning = "Estou alguns minutos atrasado"
tip = "'Running late' é o jeito natural de dizer que está atrasado."

[[phrase]]
topic = "trabalho"
situation = "Te perguntaram algo e você precisa confirmar antes."
say = "Let me double-check and get back to you"
short = "Let me check"
polished = "Let me double-check that and get back to you shortly"
meaning = "Deixa eu confirmar e te retorno"
accept = ["Let me check and get back to you"]
tip = "'Get back to you' = te dar retorno. Muito usado no trabalho."

[[phrase]]
topic = "trabalho"
situation = "Você não entendeu uma explicação técnica."
say = "Could you walk me through it?"
short = "Walk me through it?"
polished = "Would you mind walking me through it?"
meaning = "Você pode me explicar passo a passo?"
accept = ["Can you walk me through it?"]

[[phrase]]
topic = "trabalho"
situation = "Você quer confirmar se entendeu direito."
say = "Just to clarify, you mean the new version?"
short = "The new version?"
polished = "Just to clarify, do you mean the new version?"
meaning = "Só pra esclarecer, você quer dizer a nova versão?"
accept = ["Just to clarify, do you mean the new version?"]

[[phrase]]
topic = "trabalho"
situation = "Você está travado esperando outra equipe."
say = "I'm blocked on this until they fix the API"
short = "I'm blocked on this"
polished = "I'm afraid I'm blocked on this until they fix the API"
meaning = "Estou travado nisso até eles arrumarem a API"
tip = "API em inglês se fala 'ei-pi-ai'."

[[phrase]]
topic = "trabalho"
situation = "Perguntam o prazo de uma tarefa."
say = "What's the deadline for this?"
short = "When's it due?"
polished = "When would you need this by?"
meaning = "Qual é o prazo pra isso?"
accept = ["When is the deadline for this?"]

[[phrase]]
topic = "trabalho"
situation = "A reunião precisa ser adiada."
say = "Can we push this to tomorrow?"
short = "Tomorrow instead?"
polished = "Would it be possible to push this to tomorrow?"
meaning = "Podemos passar isso pra amanhã?"
accept = ["Could we push this to tomorrow?", "Can we move this to tomorrow?"]

[[phrase]]
topic = "trabalho"
situation = "Você concorda com a sugestão do colega."
say = "That makes sense"
short = "Makes sense"
polished = "That makes a lot of sense, thanks"
meaning = "Isso faz sentido"
tip = "Muito mais natural que 'I agree with you' no dia a dia."

[[phrase]]
topic = "trabalho"
situation = "Você não tem tempo pra pegar mais tarefas."
say = "I don't have the bandwidth for this right now"
short = "I'm swamped right now"
polished = "I'm afraid I don't have the bandwidth for this right now"
meaning = "Não tenho capacidade pra isso agora"
accept = ["I don't have bandwidth for this right now"]

[[phrase]]
topic = "trabalho"
situation = "Achou um problema sério em produção."
say = "I think we have a bug in production"
short = "Production bug!"
polished = "I think we might have a bug in production"
meaning = "Acho que temos um bug em produção"

[[phrase]]
topic = "trabalho"
situation = "Você vai tirar o dia de folga amanhã."
say = "I'll be out of office tomorrow"
short = "I'm off tomorrow"
polished = "Just a heads-up, I'll be out of office tomorrow"
meaning = "Vou estar fora do escritório amanhã"
accept = ["I'll be off tomorrow"]

[[phrase]]
topic = "trabalho"
situation = "Terminou a reunião e você vai mandar um resumo."
say = "I'll send a follow-up email"
short = "I'll follow up"
polished = "I'll send you a follow-up email later today"
meaning = "Vou mandar um email de acompanhamento"
accept = ["I'll send you a follow-up email"]

[[phrase]]
topic = "trabalho"
situation = "Seu áudio pode estar ruim no começo da call."
say = "Can you hear me okay?"
short = "Can you hear me?"
polished = "Sorry, can you hear me okay?"
meaning = "Você está me ouvindo bem?"
accept = ["Can you hear me?"]

[[phrase]]
topic = "trabalho"
situation = "Você discorda, mas com educação."
say = "I see your point, but I'm not sure that works"
short = "I'm not sure about that"
polished = "I see your point, but I'm not entirely sure that works"
meaning = "Entendo seu ponto, mas não tenho certeza se funciona"

[[phrase]]
topic = "trabalho"
situation = "Na daily, conte o que fez ontem."
say = "Yesterday I finished the login page"
short = "The login page is done"
polished = "Yesterday I finished the login page, and it's ready for review"
meaning = "Ontem eu terminei a página de login"
tip = "'Finished' termina com som de 't': 'fínisht'."

[[phrase]]
topic = "trabalho"
level = "A1"
situation = "Seu celular toca durante a reunião e você atende rapidinho pra avisar."
say = "I'm in a meeting."
polished = "Sorry, I'm in a meeting right now."
meaning = "Estou numa reunião."
accept = ["I'm in a meeting now"]

[[phrase]]
topic = "trabalho"
level = "A1"
situation = "Um colega chega na sua mesa enquanto você está numa ligação."
say = "I'm on a call."
short = "On a call."
polished = "Sorry, I'm on a call right now."
meaning = "Estou numa ligação."
accept = ["I'm on the phone"]

[[phrase]]
topic = "trabalho"
level = "A1"
situation = "Na festa da empresa, alguém de outra área pergunta o que você faz."
say = "I work in IT."
short = "I'm in IT."
polished = "I work in IT, on the software team."
meaning = "Trabalho com TI."
accept = ["I work in tech", "I work in technology"]

[[phrase]]
topic = "trabalho"
level = "A1"
situation = "Um colega pergunta a que horas é a reunião de hoje."
say = "The meeting is at ten."
short = "At ten."
polished = "The meeting is at ten, in the main room."
meaning = "A reunião é às dez."
accept = ["It's at ten"]

[[phrase]]
topic = "trabalho"
level = "A1"
situation = "Primeiro dia no escritório, você procura onde vai ser a reunião."
say = "Where is the meeting room?"
short = "Meeting room?"
polished = "Excuse me, could you tell me where the meeting room is?"
meaning = "Onde fica a sala de reunião?"
accept = ["Where's the meeting room?"]

[[phrase]]
topic = "trabalho"
level = "A1"
situation = "Na call, o cliente falou rápido e você não pegou o número do pedido."
say = "Can you repeat, please?"
polished = "Sorry, could you repeat that, please?"
meaning = "Pode repetir, por favor?"
accept = ["Can you repeat that, please?", "Repeat, please"]

[[phrase]]
topic = "trabalho"
level = "A1"
situation = "Um cliente chega e você apresenta a pessoa que coordena o seu time."
say = "This is my manager."
short = "My manager."
polished = "I'd like you to meet my manager."
meaning = "Esse é o meu gerente."
accept = ["This is my boss"]

[[phrase]]
topic = "trabalho"
level = "A1"
situation = "No fim da apresentação, perguntam se alguém tem dúvidas, e você tem."
say = "I have a question."
short = "Quick question."
polished = "Sorry, I have a quick question, if I may."
meaning = "Tenho uma pergunta."
accept = ["I've got a question"]

[[phrase]]
topic = "trabalho"
level = "A1"
situation = "Você acorda com febre e avisa o time no chat que não vai trabalhar."
say = "I'm sick today."
short = "Out sick today."
polished = "Hi team, I'm sick today, so I won't be working."
meaning = "Estou doente hoje."
accept = ["I'm ill today"]

[[phrase]]
topic = "trabalho"
level = "A1"
situation = "Um colega passou meia hora te ajudando a configurar o notebook."
say = "Thanks for your help."
short = "Thanks!"
polished = "Thank you so much for your help."
meaning = "Obrigado pela ajuda."
accept = ["Thank you for your help"]

[[phrase]]
topic = "trabalho"
level = "A1"
situation = "Sexta à tarde, você sai do escritório e se despede do time."
say = "See you on Monday."
short = "See you Monday."
polished = "Have a good weekend, see you on Monday."
meaning = "Até segunda."
accept = ["See you Monday"]

[[phrase]]
topic = "trabalho"
level = "A2"
situation = "Um colega quer conversar, mas você está no meio de uma entrega."
say = "Can we talk after lunch?"
polished = "Could we talk after lunch, if that's okay?"
meaning = "Podemos conversar depois do almoço?"
accept = ["Could we talk after lunch?"]

[[phrase]]
topic = "trabalho"
level = "A2"
situation = "O cliente pergunta quando vai receber a proposta."
say = "I'll send the email today."
short = "Sending it today."
polished = "I'll send you the email by the end of today."
meaning = "Mando o e-mail hoje."
accept = ["I will send the email today"]

[[phrase]]
topic = "trabalho"
level = "A2"
situation = "Um colega pergunta se você vai ao escritório hoje."
say = "I'm working from home today."
short = "Working from home."
polished = "I'm working from home today, but I'm online if you need me."
meaning = "Hoje estou trabalhando de casa."
accept = ["I'm working remotely today"]

[[phrase]]
topic = "trabalho"
level = "A2"
situation = "A reunião já começou e você não acha o convite na agenda."
say = "Can you send me the link?"
short = "Link, please?"
polished = "Could you send me the link, please?"
meaning = "Pode me mandar o link?"
accept = ["Could you send me the link?"]

[[phrase]]
topic = "trabalho"
level = "A2"
situation = "Você entra atrasado na call e explica o motivo."
say = "My internet is down."
short = "Internet's down."
polished = "Sorry for the delay, my internet is down."
meaning = "Minha internet caiu."
accept = ["My internet isn't working"]

[[phrase]]
topic = "trabalho"
level = "A2"
situation = "Na call, o som do colega some de repente."
say = "I can't hear you."
polished = "Sorry, I can't hear you very well."
meaning = "Não estou te ouvindo."
accept = ["I cannot hear you"]

[[phrase]]
topic = "trabalho"
level = "A2"
situation = "Você avisa um colega que a reunião de quarta mudou de dia."
say = "The meeting was moved to Friday."
short = "Moved to Friday."
polished = "Just so you know, the meeting was moved to Friday."
meaning = "A reunião mudou pra sexta."
accept = ["They moved the meeting to Friday"]

[[phrase]]
topic = "trabalho"
level = "A2"
situation = "O trânsito parou e você avisa no chat que vai chegar atrasado."
say = "I'll be five minutes late."
polished = "Sorry, I'll be about five minutes late."
meaning = "Vou atrasar cinco minutos."
accept = ["I'm going to be five minutes late"]

[[phrase]]
topic = "trabalho"
level = "A2"
situation = "Você quer marcar uma conversa com um cliente e pergunta o melhor horário."
say = "What time works for you?"
short = "When works?"
polished = "What time would work best for you?"
meaning = "Que horário fica bom pra você?"
accept = ["What time is good for you?"]

[[phrase]]
topic = "trabalho"
level = "A2"
situation = "O chefe pergunta como está o relatório do mês."
say = "I finished the report."
short = "Report's done."
polished = "I finished the report, I'll send it to you now."
meaning = "Terminei o relatório."
accept = ["I've finished the report"]

[[phrase]]
topic = "trabalho"
level = "A2"
situation = "Você combina com um colega de revisar o projeto juntos."
say = "Let's meet tomorrow at nine."
short = "Tomorrow at nine?"
polished = "Would it work to meet tomorrow at nine?"
meaning = "Vamos nos ver amanhã às nove."
accept = ["Let's meet at nine tomorrow"]
