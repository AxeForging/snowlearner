# decks/en: saúde e social. The header and tips are in deck.toml; src/learn/deck.rs joins the files.

[[phrase]]
topic = "saúde e social"
level = "B1"
situation = "Um amigo nota que você anda quieto e pergunta se está tudo bem."
say = "I've been feeling stressed lately."
short = "I've been stressed."
polished = "To be honest, I've been feeling stressed lately."
meaning = "Ando estressado ultimamente."
accept = ["I've been stressed lately", "I've been really stressed lately"]

[[phrase]]
topic = "saúde e social"
level = "B1"
situation = "Um colega te chama pra sair tarde numa terça-feira."
say = "I'm trying to get more sleep."
short = "I need more sleep."
polished = "I'm really trying to get more sleep these days."
meaning = "Estou tentando dormir mais."
accept = ["I'm trying to sleep more"]

[[phrase]]
topic = "saúde e social"
level = "B1"
situation = "Seu amigo está exausto e não para de trabalhar."
say = "You should take a day off."
short = "Take a day off."
polished = "I really think you should take a day off."
meaning = "Você devia tirar um dia de folga."
accept = ["You should take the day off"]
tip = "'A day off' = um dia de folga."

[[phrase]]
topic = "saúde e social"
level = "B1"
situation = "Uma amiga está doente em casa, sozinha."
say = "Text me if you need anything."
short = "Text me."
polished = "Please text me if you need anything at all."
meaning = "Me manda mensagem se precisar de alguma coisa."
accept = ["Message me if you need anything", "Call me if you need anything"]
