# decks/en: primeiros contatos. The header and tips are in deck.toml; src/learn/deck.rs joins the files.

[[phrase]]
topic = "primeiros contatos"
level = "A2"
situation = "Você trava no meio da frase conversando com um desconhecido."
say = "I'm learning English."
short = "Still learning."
polished = "I'm still learning English, so please be patient."
meaning = "Estou aprendendo inglês."
accept = ["I am learning English", "I'm still learning English"]

[[phrase]]
topic = "primeiros contatos"
level = "A2"
situation = "Um vizinho pergunta há quanto tempo você está na cidade."
say = "I moved here last year."
family = "first-home"
ask = "How long have you lived here?"
short = "Last year."
polished = "I moved here last year for work."
meaning = "Me mudei pra cá no ano passado."
accept = ["I came here last year"]

[[phrase]]
topic = "primeiros contatos"
level = "A2"
situation = "Você conversa com alguém na fila da padaria do bairro."
say = "Do you live around here?"
polished = "So, do you live around here?"
meaning = "Você mora por aqui?"
accept = ["Do you live nearby?", "Do you live near here?"]

[[phrase]]
topic = "primeiros contatos"
level = "A2"
situation = "Num jantar, a pessoa que você conheceu hoje diz que já precisa ir embora. Você se despede."
say = "It was nice meeting you."
family = "first-goodbye"
ask = "Well, I have to go now."
short = "Nice meeting you."
polished = "It was really nice meeting you today."
meaning = "Foi um prazer te conhecer."
accept = ["It was nice to meet you", "It was great meeting you"]
tip = "Na chegada é 'Nice to meet you'; na despedida, 'Nice meeting you'."

[[phrase]]
topic = "primeiros contatos"
level = "B1"
situation = "Um colega novo conta que veio de outro país."
say = "What brought you here?"
polished = "So, what brought you to this city?"
meaning = "O que te trouxe pra cá?"
accept = ["What brings you here?"]

[[phrase]]
topic = "primeiros contatos"
level = "B1"
situation = "Você conhece alguém do bairro numa festa de vizinhos."
say = "How long have you lived here?"
short = "How long?"
polished = "How long have you been living here?"
meaning = "Há quanto tempo você mora aqui?"
tip = "Pra algo que começou no passado e continua: 'have lived', não 'live'."

[[phrase]]
topic = "primeiros contatos"
level = "B1"
situation = "Um vizinho pergunta o que você está achando de morar na cidade nova. Ainda tem muita coisa diferente pra você."
say = "I'm still getting used to it."
family = "first-home"
ask = "So, how do you like living here?"
short = "Still getting used to it."
polished = "Honestly, I'm still getting used to it."
meaning = "Ainda estou me acostumando."
tip = "'Get used to' = se acostumar com."

[[phrase]]
topic = "primeiros contatos"
level = "B1"
situation = "No fim de um evento, alguém que você conheceu hoje diz que adorou conversar com você. Você quer manter contato."
say = "We should keep in touch."
family = "first-goodbye"
ask = "It was great talking to you."
short = "Let's keep in touch."
polished = "We should definitely keep in touch."
meaning = "A gente devia manter contato."
accept = ["We should stay in touch", "Let's stay in touch"]

[[phrase]]
topic = "primeiros contatos"
level = "B2"
situation = "Num jantar, alguém pergunta se você sente falta do Brasil e se pensa em voltar."
say = "I do miss it, but I'm not ready to move back just yet."
short = "I miss it, but I'm happy here."
polished = "Honestly, I do miss it, but I'm not ready to move back just yet."
meaning = "Sinto falta, sim, mas ainda não é hora de voltar."
accept = ["I miss it, but I'm not ready to go back yet."]

[[phrase]]
topic = "primeiros contatos"
level = "B2"
situation = "Você reencontra alguém que conheceu na semana passada, mas esqueceu o nome da pessoa."
say = "Sorry, your name has completely slipped my mind."
short = "Sorry, remind me of your name?"
polished = "I'm so sorry, your name has completely slipped my mind."
meaning = "Desculpa, seu nome me fugiu completamente."
accept = ["Sorry, I've forgotten your name.", "Sorry, what was your name again?"]

[[phrase]]
topic = "primeiros contatos"
level = "B2"
situation = "Numa festa, o rosto de um convidado te parece conhecido, mas você não lembra de onde."
say = "You look familiar, but I can't quite place you."
short = "You look familiar."
polished = "Sorry, you look really familiar, but I can't quite place you."
meaning = "Você não me é estranho, mas não consigo lembrar de onde te conheço."
accept = ["I know you from somewhere, but I can't remember where."]

[[phrase]]
topic = "primeiros contatos"
level = "B2"
situation = "Um vizinho pergunta o que você acha da cidade; você gosta, mas o frio te pegou de surpresa."
say = "I love it here, though the winters take some getting used to."
short = "I love it, except for the winters."
polished = "I really love it here, though I have to say the winters take some getting used to."
meaning = "Adoro morar aqui, embora o inverno exija um tempo de adaptação."
accept = ["I love it here, but the winters take some getting used to."]
tip = "'Used to' se fala 'iús-tu': o 'd' some e o 's' não vira 'z'."

[[phrase]]
topic = "primeiros contatos"
level = "A1"
situation = "O vizinho pergunta se você está gostando do bairro. Você está."
say = "Yes, it's really nice."
family = "first-home"
ask = "Do you like the neighborhood?"
polished = "Yes, it's really nice and quiet."
meaning = "Estou, é muito bom."
accept = ["Yes, it's very nice", "Yes, I really like it", "Yes, I like it a lot"]

[[phrase]]
topic = "primeiros contatos"
level = "A1"
situation = "Numa festa, você conheceu alguém há pouco, mas precisa ir embora. A pessoa pergunta se você já vai."
say = "Sorry, I have to go."
family = "first-goodbye"
ask = "Are you leaving already?"
polished = "Sorry, I really have to go now."
meaning = "Desculpa, tenho que ir."
accept = ["Sorry, I need to go", "Yes, I have to go"]
tip = "'Have to' (ter que) soa 'háf tu', com 'f'."

[[phrase]]
topic = "primeiros contatos"
level = "A1"
situation = "Na festa, o convidado pergunta como você conhece o Sam, o dono da casa. Vocês trabalham juntos."
say = "We work together."
family = "first-meet"
ask = "How do you know Sam?"
polished = "Oh, we work together. How about you?"
meaning = "A gente trabalha junto."
accept = ["We work together, actually"]

[[phrase]]
topic = "primeiros contatos"
level = "A2"
situation = "O convidado pergunta quando você e o Sam se conheceram. Foi no trabalho, há alguns anos."
say = "We met at work a few years ago."
family = "first-meet"
ask = "When did you two meet?"
short = "We met at work."
polished = "We actually met at work a few years ago."
meaning = "A gente se conheceu no trabalho há alguns anos."
accept = ["We met at work a couple of years ago", "We met at work some years ago"]
tip = "'Há alguns anos' vai no fim e com 'ago': 'a few years ago', não 'there are a few years'."

[[phrase]]
topic = "primeiros contatos"
level = "B1"
situation = "Numa festa onde você quase não conhece ninguém, um convidado pergunta o que te trouxe até ali. Um amigo te chamou e você quer conhecer gente nova."
say = "A friend invited me, I thought it'd be a good way to meet people."
family = "first-meet"
ask = "So, what brings you here tonight?"
short = "A friend invited me."
polished = "Well, a friend invited me, and I thought it'd be a nice way to meet new people."
meaning = "Um amigo me convidou, achei que seria um bom jeito de conhecer gente."
accept = ["A friend invited me, I thought it would be a good way to meet people", "My friend invited me, I thought it'd be a good way to meet people"]
tip = "'Conhecer gente' é 'meet people'; 'know people' é já conhecer. 'It'd' é 'it would' contraído."
