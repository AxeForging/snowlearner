language = "es"
native = "pt-BR"
language_name = "espanhol"
title = "Espanhol pra vida real"

# ---------------------------------------------------------------- tips

[[tip]]
text = "Falso amigo: 'embarazada' é GRÁVIDA, não envergonhada (avergonzada)."
[[tip]]
text = "Falso amigo: 'exquisito' é delicioso, elogio! Não é esquisito."
[[tip]]
text = "Falso amigo: 'oficina' é escritório. Oficina mecânica é 'taller'."
[[tip]]
text = "Falso amigo: 'polvo' é poeira. O animal é 'pulpo'."
[[tip]]
text = "Falso amigo: 'rato' é um momento. O bicho é 'ratón'."
[[tip]]
text = "Falso amigo: 'apellido' é sobrenome, não apelido (apodo)."
[[tip]]
text = "Falso amigo: 'propina' é gorjeta. Não é crime!"
[[tip]]
text = "Falso amigo: 'cena' é jantar. A cena do filme é 'escena'."
[[tip]]
text = "Pronúncia: o 'j' e o 'g' antes de e/i soam como um 'rr' forte: 'jamón'."
[[tip]]
text = "Pronúncia: 'll' e 'y' soam parecido com 'j' ou 'i': 'calle' = 'caje'."
[[tip]]
text = "Pronúncia: não nasalize! 'Pan' não é 'pão': fale o 'n' no fim."
[[tip]]
text = "Pronúncia: o 'z' e o 'c' (antes de e/i) viram 'th' na Espanha e 's' na América."
[[tip]]
text = "Em espanhol se 'tem' fome e frio: tengo hambre, tengo frío."
[[tip]]
text = "'Usted' é o formal. Use com pessoas mais velhas e no trabalho."
[[tip]]
text = "No clima usa-se 'hace': hace frío, hace calor, hace sol."

# ---------------------------------------------------------------- trabajo

[[phrase]]
topic = "trabalho"
situation = "O colega está falando, mas está no mudo."
say = "Perdón, estás en silencio"
meaning = "Desculpa, você está no mudo"
accept = ["Estás en silencio", "Tienes el micrófono apagado"]

[[phrase]]
topic = "trabalho"
situation = "Você quer ver o que o colega está mostrando."
say = "¿Puedes compartir tu pantalla?"
meaning = "Pode compartilhar sua tela?"
accept = ["¿Podrías compartir tu pantalla?"]

[[phrase]]
topic = "trabalho"
situation = "Você vai se atrasar para a reunião."
say = "Voy a llegar unos minutos tarde"
meaning = "Vou chegar alguns minutos atrasado"

[[phrase]]
topic = "trabalho"
situation = "Precisa confirmar antes de responder."
say = "Déjame revisarlo y te aviso"
meaning = "Deixa eu revisar e te aviso"
accept = ["Lo reviso y te aviso"]

[[phrase]]
topic = "trabalho"
situation = "Não entendeu a explicação."
say = "¿Me lo puedes explicar paso a paso?"
meaning = "Você pode me explicar passo a passo?"

[[phrase]]
topic = "trabalho"
situation = "Perguntam o prazo de uma tarefa."
say = "¿Cuál es la fecha de entrega?"
meaning = "Qual é o prazo de entrega?"

[[phrase]]
topic = "trabalho"
situation = "A reunião precisa ser adiada."
say = "¿Podemos pasarlo para mañana?"
meaning = "Podemos passar isso pra amanhã?"
accept = ["¿Lo podemos pasar para mañana?"]

[[phrase]]
topic = "trabalho"
situation = "Você concorda com a ideia."
say = "Tiene sentido"
meaning = "Faz sentido"

[[phrase]]
topic = "trabalho"
situation = "Achou um problema sério em produção."
