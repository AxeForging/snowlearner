meaning = "Acho que tem um erro em produção"

[[phrase]]
topic = "trabalho"
situation = "Vai mandar um resumo depois da reunião."
say = "Te mando un correo con el resumen"
meaning = "Te mando um email com o resumo"
tip = "Email em espanhol é 'correo' (ou 'mail' na conversa)."

[[phrase]]
topic = "trabalho"
situation = "Quer saber se o áudio está bom."
say = "¿Me escuchas bien?"
meaning = "Você está me ouvindo bem?"
accept = ["¿Me oyes bien?"]

[[phrase]]
topic = "trabalho"
situation = "Discorda, mas com educação."
