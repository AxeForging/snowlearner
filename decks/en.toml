[[phrase]]
say = "I'm hungry"
meaning = "Estou com fome"
cue = "Para dizer que estou com fome, devo dizer: {}"
tip = "O 'h' de hungry sai como um 'rr' suave: 'rrãngri'."

[[phrase]]
