language = "en"
native = "pt-BR"
language_name = "inglês"
title = "Inglês pra vida real"

# ---------------------------------------------------------------- tips
# General tips the warrior drops between challenges.

[[tip]]
text = "Falso amigo: 'actually' é 'na verdade', não 'atualmente' (currently)."
[[tip]]
text = "Falso amigo: 'pretend' é 'fingir'. 'Pretender' é 'intend' ou 'plan to'."
[[tip]]
text = "Falso amigo: 'push' é EMPURRAR. Puxar é 'pull'. Olhe a porta!"
[[tip]]
text = "Falso amigo: 'library' é biblioteca. Livraria é 'bookstore'."
[[tip]]
text = "Falso amigo: 'exquisite' é refinado, elogio! Não é 'esquisito' (weird)."
[[tip]]
text = "Falso amigo: 'parents' são pai e mãe. Parentes são 'relatives'."
[[tip]]
text = "Falso amigo: 'lunch' é almoço. Lanche é 'snack'."
[[tip]]
text = "Pronúncia: final -ed quase não soa. 'worked' = 'uórkt', não 'uórqued'."
[[tip]]
text = "Pronúncia: o 'th' é língua entre os dentes. 'think' não é 'fink' nem 'tink'."
[[tip]]
text = "Pronúncia: não coloque 'i' no fim: 'Facebook' não é 'feicebuki'."
[[tip]]
text = "Pronúncia: 'beach' tem 'i' longo; 'bitch' tem 'i' curto. Cuidado na praia!"
[[tip]]
text = "Educação: 'Could you...?' soa bem mais gentil que 'Can you...?'."
[[tip]]
text = "Pra ganhar tempo pensando: 'Let me think...' ou 'That's a good question'."
[[tip]]
text = "Não entendeu? Tudo bem pedir: 'Sorry, could you say that again?'."
[[tip]]
text = "'How are you?' muitas vezes é só um oi. Responda curto: 'Good, you?'."
[[tip]]
text = "Em email e reunião, 'I'm afraid...' suaviza uma notícia ruim."

# ---------------------------------------------------------------- trabalho

[[phrase]]
topic = "trabalho"
situation = "O colega está falando, mas está no mudo."
say = "Sorry, you're on mute"
meaning = "Desculpa, você está no mudo"
accept = ["You're on mute"]

[[phrase]]
topic = "trabalho"
situation = "Você quer ver o que o colega está mostrando."
say = "Can you share your screen?"
meaning = "Pode compartilhar sua tela?"
accept = ["Could you share your screen?"]

[[phrase]]
topic = "trabalho"
situation = "Você vai se atrasar para a daily."
say = "I'm running a few minutes late"
meaning = "Estou alguns minutos atrasado"
tip = "'Running late' é o jeito natural de dizer que está atrasado."

[[phrase]]
topic = "trabalho"
situation = "Te perguntaram algo e você precisa confirmar antes."
say = "Let me double-check and get back to you"
meaning = "Deixa eu confirmar e te retorno"
accept = ["Let me check and get back to you"]
tip = "'Get back to you' = te dar retorno. Muito usado no trabalho."

[[phrase]]
topic = "trabalho"
situation = "Você não entendeu uma explicação técnica."
say = "Could you walk me through it?"
meaning = "Você pode me explicar passo a passo?"
accept = ["Can you walk me through it?"]

[[phrase]]
topic = "trabalho"
situation = "Você quer confirmar se entendeu direito."
say = "Just to clarify, you mean the new version?"
meaning = "Só pra esclarecer, você quer dizer a nova versão?"
accept = ["Just to clarify, do you mean the new version?"]

[[phrase]]
topic = "trabalho"
situation = "Você está travado esperando outra equipe."
say = "I'm blocked on this until they fix the API"
meaning = "Estou travado nisso até eles arrumarem a API"
tip = "API em inglês se fala 'ei-pi-ai'."

[[phrase]]
topic = "trabalho"
situation = "Perguntam o prazo de uma tarefa."
say = "What's the deadline for this?"
meaning = "Qual é o prazo pra isso?"
accept = ["When is the deadline for this?"]

[[phrase]]
topic = "trabalho"
situation = "A reunião precisa ser adiada."
say = "Can we push this to tomorrow?"
meaning = "Podemos passar isso pra amanhã?"
accept = ["Could we push this to tomorrow?", "Can we move this to tomorrow?"]

[[phrase]]
topic = "trabalho"
situation = "Você concorda com a sugestão do colega."
say = "That makes sense"
meaning = "Isso faz sentido"
tip = "Muito mais natural que 'I agree with you' no dia a dia."

[[phrase]]
topic = "trabalho"
situation = "Você não tem tempo pra pegar mais tarefas."
say = "I don't have the bandwidth for this right now"
meaning = "Não tenho capacidade pra isso agora"
accept = ["I don't have bandwidth for this right now"]

[[phrase]]
topic = "trabalho"
situation = "Achou um problema sério em produção."
say = "I think we have a bug in production"
meaning = "Acho que temos um bug em produção"

[[phrase]]
topic = "trabalho"
situation = "Você vai tirar o dia de folga amanhã."
say = "I'll be out of office tomorrow"
meaning = "Vou estar fora do escritório amanhã"
accept = ["I'll be off tomorrow"]

[[phrase]]
topic = "trabalho"
situation = "Terminou a reunião e você vai mandar um resumo."
say = "I'll send a follow-up email"
meaning = "Vou mandar um email de acompanhamento"
accept = ["I'll send you a follow-up email"]

[[phrase]]
topic = "trabalho"
situation = "Seu áudio pode estar ruim no começo da call."
say = "Can you hear me okay?"
meaning = "Você está me ouvindo bem?"
accept = ["Can you hear me?"]

[[phrase]]
topic = "trabalho"
situation = "Você discorda, mas com educação."
say = "I see your point, but I'm not sure that works"
meaning = "Entendo seu ponto, mas não tenho certeza se funciona"

[[phrase]]
topic = "trabalho"
situation = "Na daily, conte o que fez ontem."
say = "Yesterday I finished the login page"
meaning = "Ontem eu terminei a página de login"
tip = "'Finished' termina com som de 't': 'fínisht'."

