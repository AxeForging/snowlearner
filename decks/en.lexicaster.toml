meaning = "Acho que não."
accept = ["I do not think so"]
tip = "O \"not\" vai no primeiro verbo: \"I don't think it's open\", e não \"I think it's not open\"."

[[phrase]]
topic = "saúde e social"
level = "A2"
situation = "Para manter contato depois de conhecer alguém ou combinar os detalhes de um encontro."
say = "Send me a message!"
meaning = "Me manda uma mensagem!"
accept = ["text me", "send me a text"]
tip = "Nos EUA \"text me\" é o mais comum; muita gente usa SMS e iMessage mais que WhatsApp."

[[phrase]]
topic = "saúde e social"
level = "A2"
situation = "Despedida calorosa para quem te recebeu, ajudou ou fez parte da sua viagem."
say = "Thank you for everything!"
meaning = "Obrigado por tudo!"
accept = ["thanks for everything"]
tip = "Depois de \"for\" o verbo vai com -ing: \"thank you for helping me\"."

[[phrase]]
topic = "saúde e social"
level = "A2"
situation = "Para descrever onde você mora a um amigo novo, a um colega ou numa conversa sobre aluguel."
say = "My apartment has two bedrooms."
meaning = "Meu apartamento tem dois quartos."
accept = ["my place has two bedrooms"]

[[phrase]]
topic = "saúde e social"
level = "A2"
situation = "Reclamação clássica no hotel, hostel ou apartamento alugado."
say = "There's no hot water."
meaning = "Não tem água quente."
accept = ["there is no hot water", "there isn't any hot water", "the water isn't hot"]
tip = "Com \"there's no…\" não se usa \"not\": \"there's no hot water\" ou \"there isn't any hot water\"."

[[phrase]]
topic = "saúde e social"
level = "A2"
situation = "Para avisar de uma lâmpada queimada ou falta de energia num quarto, escritório ou casa alugada."
say = "The light doesn't turn on."
meaning = "A luz não acende."
accept = ["the light won't turn on", "the light does not turn on", "the light isn't working"]

[[phrase]]
topic = "saúde e social"
level = "A2"
situation = "Pergunta educada numa casa de família, hostel ou quarto alugado antes de cozinhar."
say = "Can I use the kitchen?"
meaning = "Posso usar a cozinha?"
accept = ["could I use the kitchen", "may I use the kitchen", "can I use your kitchen"]
tip = "\"Can I\" é o normal no dia a dia; \"may I\" soa bem formal, e \"could I\" é o meio-termo educado."

[[phrase]]
topic = "saúde e social"
level = "A2"
situation = "Para avisar o dono ou quem mora com você de um problema."
say = "The washing machine is broken."
meaning = "A máquina de lavar quebrou."
accept = ["the washing machine isn't working", "the washing machine doesn't work", "the washer is broken"]

[[phrase]]
topic = "saúde e social"
level = "A2"
situation = "A pergunta de segunda-feira no trabalho, na aula ou com amigos."
say = "What did you do last weekend?"
meaning = "O que fez no fim de semana?"
accept = ["what did you do on the weekend", "what did you do this weekend"]
tip = "Perguntas no passado usam \"did\" + verbo na forma base: \"what did you do?\", nunca \"what did you did?\"."

[[phrase]]
topic = "saúde e social"
level = "A2"
situation = "Resposta simples para contar o que fez."
say = "I went to the beach."
meaning = "Eu fui à praia."
accept = ["we went to the beach"]

[[phrase]]
topic = "saúde e social"
level = "A2"
situation = "Para dizer que algo foi ótimo: viagem, show, comida, fim de semana."
say = "It was amazing!"
meaning = "Foi incrível!"
accept = ["it was great", "it was awesome"]

[[phrase]]
topic = "saúde e social"
level = "A2"
situation = "Para receber quem voltou de viagem ou acabou de chegar."
say = "How was your trip?"
meaning = "Como foi a viagem?"
accept = ["how was the trip"]

[[phrase]]
topic = "saúde e social"
level = "A2"
situation = "Resposta comum sobre o fim de semana ou um feriado."
say = "I visited my family."
meaning = "Visitei minha família."
accept = ["I went to see my family", "I visited my parents"]

[[phrase]]
topic = "vida no exterior"
level = "A2"
situation = "Para quando você perdeu só um pedaço da frase."
say = "Sorry, what did you say?"
meaning = "Desculpa, o que você disse?"
accept = ["what did you say", "sorry what was that"]
tip = "\"Sorry?\" ou \"pardon?\" com tom de pergunta já bastam. \"Come again?\" é bem informal."

[[phrase]]
topic = "vida no exterior"
level = "A2"
situation = "Para continuar a conversa em vez de desistir."
say = "Could you speak more slowly?"
meaning = "Pode falar mais devagar?"
accept = ["can you speak more slowly", "could you slow down", "can you slow down"]
tip = "Dizer \"I'm still learning English\" antes faz a pessoa ter paciência. \"Slow down\" é mais casual."

[[phrase]]
topic = "vida no exterior"
level = "A2"
situation = "Para perguntar o sentido de uma palavra ou expressão que você acabou de ouvir, sem parar a conversa."
say = "What does that mean?"
meaning = "O que isso significa?"
accept = ["what does it mean", "what does this mean", "what does that word mean"]
tip = "Erro clássico: \"what means that?\". O certo é \"what does that mean?\", com \"does\" e \"mean\" no fim."

[[phrase]]
topic = "vida no exterior"
level = "A2"
situation = "Para anotar certo um nome, um e-mail ou uma rua."
say = "How do you spell that?"
meaning = "Como se escreve isso?"
accept = ["how do you spell it", "how do you spell this", "can you spell that"]
tip = "Nomes em inglês quase sempre são soletrados ao telefone. Confirme repetindo as letras: \"W-R-I-G-H-T?\"."

[[phrase]]
topic = "vida no exterior"
level = "A2"
situation = "O plano B para endereços, números e nomes difíceis: no papel ou no celular, ninguém entende errado."
say = "Can you write it down?"
meaning = "Pode escrever para mim?"
accept = ["could you write it down", "can you write that down", "could you write that down"]
tip = "O pronome fica no meio: \"write it down\", nunca \"write down it\"."

[[phrase]]
topic = "vida no exterior"
level = "A2"
situation = "Para recusar um papo ou um convite sem ser grosseiro, deixando a porta aberta para outro dia."
say = "I'm very busy today."
meaning = "Estou muito ocupado hoje."
accept = ["I am very busy today", "I'm really busy today", "I'm so busy today"]
tip = "Suavize com uma alternativa: \"I'm very busy today, but I'm free tomorrow\"."

[[phrase]]
topic = "vida no exterior"
level = "A2"
situation = "Pergunta de todo dia para puxar papo por mensagem ou saber se a pessoa está livre."
say = "What are you doing?"
meaning = "O que você está fazendo?"
accept = ["what are you up to"]
tip = "Com tom seco soa como bronca (\"o que você pensa que está fazendo?\"). \"What are you up to?\" é mais leve."

[[phrase]]
topic = "vida no exterior"
level = "A2"
situation = "Um modelo para contar hábitos."
say = "I usually get up early."
meaning = "Costumo acordar cedo."
accept = ["I usually wake up early", "I normally get up early"]
tip = "Hábitos usam o presente simples, não \"-ing\": \"I usually get up\", não \"I'm usually getting up\"."

[[phrase]]
topic = "vida no exterior"
level = "A2"
situation = "Para se despedir no fim do dia ou avisar alguém, por mensagem, que você já está saindo."
say = "I'm going home."
meaning = "Vou para casa."
accept = ["I am going home", "I'm heading home"]
tip = "Sem \"to\": \"I'm going home\", nunca \"going to home\". O mesmo com \"get home\" (chegar em casa)."

[[phrase]]
topic = "vida no exterior"
level = "A2"
situation = "A mensagem mais mandada antes de um encontro: avisa que você já saiu e vai chegar."
say = "I'm on my way!"
meaning = "Estou a caminho!"
accept = ["I am on my way", "on my way"]
tip = "Em mensagens aparece como \"omw\". \"On the way\" é \"no caminho\": \"I'll buy it on the way\"."

[[phrase]]
topic = "vida no exterior"
level = "A2"
situation = "Avise antes do horário combinado, não depois."
say = "I'm running late."
meaning = "Vou me atrasar."
accept = ["I am running late", "I'm going to be late", "I'll be late"]
tip = "\"I'm running late\" = vou me atrasar (ainda a caminho); \"I'm late\" = já estou atrasado."

[[phrase]]
topic = "vida no exterior"
level = "A2"
situation = "Para atender rapidinho quando você não pode falar - no ônibus, numa reunião - sem ignorar a pessoa."
say = "Can I call you back?"
meaning = "Posso te ligar depois?"
accept = ["could I call you back", "I'll call you back", "can I call you later"]
tip = "\"Call back\" = retornar a ligação. \"I missed your call\" = perdi sua ligação."

[[phrase]]
topic = "vida no exterior"
level = "A2"
situation = "A primeira frase ao telefone com clínica, dentista, salão ou repartição."
say = "I'd like to make an appointment."
meaning = "Queria marcar uma consulta."
accept = ["I would like to make an appointment", "I'd like to book an appointment", "can I make an appointment"]
tip = "\"Make\" ou \"book an appointment\". Para restaurante e hotel use \"reservation\", não \"appointment\"."

[[phrase]]
topic = "vida no exterior"
level = "A2"
situation = "Para fechar um plano sem soletrar ruas: o endereço chega por escrito e abre direto no mapa."
say = "I'll text you the address."
meaning = "Te mando o endereço por mensagem."
accept = ["I will text you the address", "I'll send you the address", "I'll message you the address"]
tip = "\"Text\" também é verbo: \"I'll text you\" = te mando mensagem. \"Drop me a pin\" = manda a localização."

[[phrase]]
topic = "vida no exterior"
level = "A2"
situation = "Um modelo para pedir algo emprestado por pouco tempo."
say = "Can I borrow your charger?"
meaning = "Me empresta seu carregador?"
accept = ["could I borrow your charger", "can I use your charger"]
tip = "Quem pede usa \"borrow\" (\"can I borrow…?\"); quem dá usa \"lend\" (\"I can lend you mine\")."

[[phrase]]
topic = "vida no exterior"
level = "A2"
situation = "Para sentar ao lado de um desconhecido na balsa, no ônibus ou num café cheio sem parecer invasivo."
say = "Do you mind if I sit here?"
meaning = "Posso sentar aqui?"
accept = ["is it okay if I sit here", "can I sit here", "mind if I sit here"]
tip = "A resposta \"no\" quer dizer \"pode sentar\": \"No, not at all\" / \"No, go ahead\". \"Yes\" seria \"me incomoda\"."

[[phrase]]
topic = "vida no exterior"
level = "A2"
situation = "Um pedido de ajuda concreto, bem mais fácil de aceitar do que um \"me ajuda?\" vago."
say = "Could you help me carry this?"
meaning = "Pode me ajudar a carregar isso?"
accept = ["can you help me carry this", "could you help me with this", "can you help me with this"]
tip = "Depois de \"help me\" o verbo vem sem \"to\" na fala: \"help me carry\", \"help me find\"."

[[phrase]]
topic = "vida no exterior"
level = "A2"
situation = "O \"sim\" caloroso a um pedido de permissão: sentar, pegar emprestado, abrir a janela."
say = "Sure, go ahead!"
meaning = "Claro, fique à vontade!"
accept = ["of course go ahead", "go ahead"]
tip = "Para \"do you mind if…?\" responda \"not at all, go ahead\" - sem \"yes\"."

[[phrase]]
topic = "vida no exterior"
level = "A2"
situation = "Um \"não\" gentil a um favor."
say = "Sorry, I can't right now."
meaning = "Desculpa, agora não posso."
accept = ["I'm sorry I can't right now", "sorry not right now", "I can't right now"]
tip = "\"Can't\" soa \"kent\" (EUA); \"can\" soa \"ken\". Ofereça outra hora: \"maybe later?\"."

[[phrase]]
topic = "vida no exterior"
level = "A2"
situation = "Para reclamar de algo quebrado: chuveiro, ar-condicionado, wifi, cartão."
say = "It doesn't work."
meaning = "Não está funcionando."
accept = ["it does not work", "it's not working", "it is not working", "this doesn't work"]
tip = "\"It's not working\" é para agora; \"it doesn't work\" soa como defeito permanente. Placas dizem \"out of order\"."

[[phrase]]
topic = "vida no exterior"
level = "A2"
situation = "O pedido de ajuda da viagem moderna: no hotel, no táxi, no achados e perdidos ou para bloquear o chip."
say = "I lost my phone!"
meaning = "Perdi meu celular!"
accept = ["I've lost my phone", "I lost my cell phone"]
tip = "Achados e perdidos é \"lost and found\" (EUA). \"I've lost\" (Reino Unido) = \"I lost\" (EUA)."

[[phrase]]
topic = "vida no exterior"
level = "A2"
situation = "Para pedir ajuda na hora e registrar a ocorrência na polícia."
say = "Someone stole my wallet!"
meaning = "Roubaram minha carteira!"
accept = ["somebody stole my wallet", "my wallet was stolen", "my wallet got stolen"]
tip = "Para a polícia: \"I want to report a theft\" (quero registrar um roubo)."

[[phrase]]
topic = "vida no exterior"
level = "A2"
situation = "Para apontar um erro na conta, no troco ou na reserva sem acusar ninguém."
say = "I think there's a mistake."
meaning = "Acho que tem um erro."
accept = ["I think there is a mistake", "I think there's been a mistake", "I think there's an error"]
tip = "\"On the check/bill\" (não \"in\"). \"I think\" deixa a reclamação educada: evite \"you made a mistake\"."

[[phrase]]
topic = "vida no exterior"
level = "A2"
situation = "Diga ao pedir, não depois de o prato chegar."
say = "I'm allergic to shellfish."
meaning = "Sou alérgico a frutos do mar."
accept = ["I am allergic to shellfish", "I have a shellfish allergy"]
tip = "\"Seafood\" é peixe e frutos do mar; \"shellfish\" é só camarão, lagosta, mexilhão… Seja preciso."

[[phrase]]
topic = "trabalho"
level = "B1"
situation = "A primeira frase do primeiro dia."
say = "I'm new to the team."
meaning = "Sou novo na equipe."
accept = ["I am new to the team", "I'm new on the team", "I'm new here"]
tip = "Para dizer a função: \"I'm the new designer\" (com \"the\"). Sem artigo (\"I'm new designer\") soa errado."

[[phrase]]
topic = "trabalho"
level = "B1"
situation = "Para cumprimentar um grupo inteiro de uma vez: a equipe na primeira reunião ou numa volta pelo escritório."
say = "Nice to meet you all!"
meaning = "Prazer em conhecer vocês!"
accept = ["nice to meet you guys", "great to meet you all", "nice to meet everyone"]
tip = "Exemplo: Nice to meet you all! I look forward to working with you."

[[phrase]]
topic = "trabalho"
level = "B1"
situation = "Para puxar conversa com um colega e entender quem faz o quê."
say = "What do you do here?"
meaning = "O que você faz aqui?"
accept = ["what's your role here", "what is your role here"]
tip = "\"What do you do?\" já quer dizer \"qual é a sua profissão?\". \"What are you doing?\" é o que está fazendo agora."

[[phrase]]
topic = "trabalho"
level = "B1"
situation = "Quando você não sabe quem resolve algo: acesso ao sistema, crachá, férias."
say = "Who should I ask?"
meaning = "Para quem eu pergunto?"
accept = ["who do I ask", "who can I ask", "who should I talk to"]
tip = "Exemplo: I still don't have a login. Who should I ask?"

[[phrase]]
topic = "trabalho"
level = "B1"
situation = "O modelo para achar qualquer coisa no trabalho: troque \"impressora\" por cozinha, sala de reunião ou banheiro."
say = "Where can I find the printer?"
meaning = "Onde fica a impressora?"
accept = ["where's the printer", "where is the printer"]
tip = "Exemplo: Excuse me, where can I find the printer on this floor?"

[[phrase]]
topic = "trabalho"
level = "B1"
situation = "Para abrir uma reunião quando todos chegaram."
say = "Let's get started."
meaning = "Vamos começar?"
accept = ["let's start", "shall we start", "should we get started", "shall we get started"]
tip = "Nos EUA \"shall\" soa formal; o comum é \"let's get started\" ou \"should we get started?\"."

[[phrase]]
topic = "trabalho"
level = "B1"
situation = "Quando surge um imprevisto."
say = "Can we reschedule the meeting?"
meaning = "Podemos remarcar a reunião?"
accept = ["could we reschedule the meeting", "can we move the meeting", "can we push the meeting back"]
tip = "\"Something came up\" (surgiu um imprevisto) é a desculpa educada padrão, sem dar detalhes."

[[phrase]]
topic = "trabalho"
level = "B1"
situation = "Para responder \"quando você pode?\"."
say = "I'm free on Monday."
meaning = "Estou livre na segunda."
accept = ["I am free on monday", "I'm available on monday", "I'm free monday"]
tip = "Dias da semana levam \"on\" e maiúscula ao escrever: \"on Monday\". Nos EUA também se diz \"I'm free Monday\"."

[[phrase]]
topic = "trabalho"
level = "B1"
situation = "Ao entrar numa reunião que já começou."
say = "Sorry I'm late!"
meaning = "Desculpa o atraso!"
accept = ["sorry I am late", "I'm sorry I'm late", "sorry for being late"]
tip = "Exemplo: Sorry I'm late, the traffic was terrible."

[[phrase]]
topic = "trabalho"
level = "B1"
situation = "Para deixar claro até quando algo precisa estar pronto."
say = "The deadline is Friday."
meaning = "O prazo é sexta."
accept = ["the deadline is on friday", "it has to be done by friday", "it's due friday"]
tip = "\"Due\" = com prazo: \"the report is due Friday\". \"End of day\" (EOD) é até o fim do expediente."

[[phrase]]
topic = "trabalho"
level = "B1"
situation = "Pedido informal de ajuda a um colega."
say = "Could you give me a hand?"
meaning = "Você me dá uma mão?"
accept = ["can you give me a hand", "could you lend me a hand"]
tip = "\"Give me a hand\" = me dar uma mão (ajudar). \"Give me your hand\" é literalmente pegar a mão!"

[[phrase]]
topic = "trabalho"
level = "B1"
situation = "Para explicar por que precisa de ajuda."
say = "I'm stuck on this."
meaning = "Estou travado nisso."
accept = ["I am stuck on this", "I'm stuck with this"]
tip = "Não existe \"I'm stucked\": \"stuck\" já é o particípio. \"I got stuck\" = eu travei."

[[phrase]]
topic = "trabalho"
level = "B1"
situation = "Resposta a um pedido ou problema que você ainda não sabe resolver."
say = "I'll look into it."
meaning = "Vou verificar."
accept = ["I will look into it", "I'll look into that", "I'll check it out"]
tip = "Exemplo: I'm not sure why the client didn't get it. I'll look into it."

[[phrase]]
topic = "trabalho"
level = "B1"
situation = "A atualização mais pedida do escritório."
say = "It's almost done."
meaning = "Está quase pronto."
accept = ["it is almost done", "it's nearly done", "it's almost finished"]
tip = "\"Done\" = pronto/terminado. \"Ready\" é pronto para usar. \"Almost there!\" também é muito comum."

[[phrase]]
topic = "trabalho"
level = "B1"
situation = "Para fechar uma conversa oferecendo ajuda."
say = "Let me know if you need anything."
meaning = "Se precisar de algo, me avisa."
accept = ["let me know if you need something", "just let me know"]
tip = "Exemplo: Have a great first day! Let me know if you need anything."

[[phrase]]
topic = "trabalho"
level = "B1"
situation = "Para ir direto ao assunto numa ligação de trabalho, logo depois de dizer quem você é."
say = "I'm calling about your email."
meaning = "Estou ligando sobre o seu email."
accept = ["I am calling about your email", "I'm calling about the email you sent"]
tip = "Ao atender e perguntarem por você: \"Speaking.\" (sou eu). Para se apresentar: \"This is Ana\"."

[[phrase]]
topic = "trabalho"
level = "B1"
situation = "Pedido educado de documento a um colega ou cliente."
say = "Could you send me the file?"
meaning = "Pode me enviar o arquivo?"
accept = ["can you send me the file", "could you send the file over"]
tip = "\"Could you\" soa mais educado que \"can you\". Com cliente, adicione \"please\" no fim."

[[phrase]]
topic = "trabalho"
level = "B1"
situation = "Quando você não tem a resposta agora."
say = "I'll get back to you."
meaning = "Eu te dou um retorno."
accept = ["I will get back to you", "let me get back to you"]
tip = "\"Get back to you\" = dar retorno. Não confunda com \"call you back\" (retornar a ligação)."

[[phrase]]
topic = "trabalho"
level = "B1"
situation = "Fórmula de email para mandar um documento."
say = "Please find the report attached."
meaning = "Segue o relatório em anexo."
accept = ["please find attached the report", "please see the attached report", "I've attached the report"]
tip = "Nos EUA muita gente acha \"please find attached\" antiquado; \"I've attached…\" ou \"attached is…\" soam naturais."

[[phrase]]
topic = "trabalho"
level = "B1"
situation = "Quando a pessoa que você procura não pode atender."
say = "Can I leave a message?"
meaning = "Posso deixar um recado?"
accept = ["could I leave a message", "can I leave her a message", "can I leave him a message"]
tip = "Exemplo: She's in a meeting? Can I leave a message?"

[[phrase]]
topic = "trabalho"
level = "B1"
situation = "O modelo para dizer a sua profissão, em entrevistas ou conversas."
say = "I work as a teacher."
meaning = "Trabalho como professor."
accept = ["I'm a teacher", "I am a teacher"]
tip = "Profissão pede artigo em inglês: \"I work as A teacher\", \"I'm AN engineer\". Sem ele soa errado."

[[phrase]]
topic = "trabalho"
level = "B1"
situation = "Frase-chave de entrevista."
say = "I have experience in sales."
meaning = "Tenho experiência em vendas."
accept = ["I've got experience in sales", "I have sales experience"]
tip = "Exemplo: I have experience in sales: five years at an electronics store."

[[phrase]]
topic = "trabalho"
level = "B1"
situation = "Pergunta essencial numa entrevista ou oferta."
say = "What are the working hours?"
meaning = "Qual é o horário de trabalho?"
accept = ["what are the hours", "what are the work hours"]
tip = "\"Hours\" no plural: \"the hours are flexible\". \"Nine to five\" virou sinônimo de emprego de escritório."

[[phrase]]
topic = "trabalho"
level = "B1"
situation = "No fim da entrevista ou ao receber a proposta."
say = "When can I start?"
meaning = "Quando posso começar?"
accept = ["when do I start", "when would I start"]
tip = "Exemplo: That's great news! When can I start?"

[[phrase]]
topic = "trabalho"
level = "B1"
situation = "Para contar a conhecidos, agências ou numa feira de empregos."
say = "I'm looking for a job."
meaning = "Estou procurando emprego."
accept = ["I am looking for a job", "I'm looking for work", "I'm job hunting"]
tip = "Vaga é \"opening\" ou \"position\" nos EUA. \"Hiring\" = contratando: \"they're hiring\"."

[[phrase]]
topic = "casa e burocracia"
level = "B1"
situation = "Para abrir a conversa numa imobiliária, num grupo de moradia ou com quem publicou o anúncio."
say = "I'm looking for an apartment."
meaning = "Estou procurando um apartamento."
accept = ["I am looking for an apartment", "I'm looking for a place to rent", "I'm looking for a flat"]
tip = "\"Look for\" é procurar; \"look at\" é olhar. Um apartamento para dividir é \"a room for rent\"."

[[phrase]]
topic = "casa e burocracia"
level = "B1"
situation = "A primeira pergunta sobre qualquer imóvel."
say = "How much is the rent?"
meaning = "Quanto é o aluguel?"
accept = ["how much is rent", "what's the rent", "what is the rent"]
tip = "Exemplo: I really like it. How much is the rent?"

[[phrase]]
topic = "casa e burocracia"
level = "B1"
situation = "Pergunte antes de fechar negócio: luz, água e internet podem somar bastante ao aluguel."
say = "Are utilities included?"
meaning = "As contas estão incluídas?"
accept = ["are the utilities included", "are bills included", "is everything included"]
tip = "Os anúncios americanos escrevem \"utilities included\" ou \"utilities not included\". \"Heat and water\" às vezes vêm incluídos."

[[phrase]]
topic = "casa e burocracia"
level = "B1"
situation = "Para combinar a data de entrada."
say = "When can I move in?"
meaning = "Quando posso me mudar?"
accept = ["when could I move in", "when is it available", "when's it available"]
tip = "A resposta costuma ser \"it's available on the 1st\" ou \"you can move in right away\"."

[[phrase]]
topic = "casa e burocracia"
level = "B1"
situation = "Para saber quanto dinheiro você precisa ter na mão no dia da assinatura, além do primeiro aluguel."
say = "Is there a deposit?"
meaning = "Tem caução?"
accept = ["do I need to pay a deposit", "how much is the deposit", "do you need a deposit"]
tip = "Pergunte também \"is it refundable?\" (é devolvido?). \"First and last month\" é pagar dois meses adiantados."

[[phrase]]
topic = "casa e burocracia"
level = "B1"
situation = "Para dizer no balcão do banco por que você veio."
say = "I'd like to open an account."
meaning = "Queria abrir uma conta."
accept = ["I would like to open an account", "I'd like to open a bank account", "I want to open an account"]
tip = "Muitos bancos exigem hora marcada: \"do I need an appointment?\". \"Branch\" é a agência."

[[phrase]]
topic = "casa e burocracia"
level = "B1"
situation = "Na prefeitura ou no guichê de estrangeiros, logo depois de se mudar."
say = "I need to register my address."
meaning = "Preciso registrar meu endereço."
accept = ["I have to register my address", "I need to register my new address"]
tip = "Nos EUA não existe registro de endereço; você só atualiza o endereço no banco e na \"DMV\"."

[[phrase]]
topic = "casa e burocracia"
level = "B1"
situation = "Para oferecer o documento no guichê antes que peçam."
say = "Do you need my passport?"
meaning = "Precisa do meu passaporte?"
accept = ["do you need to see my passport", "do you want my passport", "would you like my passport"]
tip = "Exemplo: Here is my lease. Do you need my passport too?"

[[phrase]]
topic = "casa e burocracia"
level = "B1"
situation = "No fim de todo trâmite: contrato, banco, entrega de encomenda."
say = "Where do I sign?"
meaning = "Onde eu assino?"
accept = ["where should I sign", "where do I need to sign"]
tip = "A resposta costuma ser \"sign and date here\" (assine e date) ou \"initial here\" (rubrique aqui)."

[[phrase]]
topic = "casa e burocracia"
level = "B1"
situation = "Pergunte antes de ir, por telefone ou no balcão: evita voltar duas vezes por falta de um papel."
say = "What documents do I need?"
meaning = "Que documentos eu preciso?"
accept = ["which documents do I need", "what paperwork do I need", "what do I need to bring"]
tip = "Exemplo: I want to open an account. What documents do I need?"

[[phrase]]
topic = "casa e burocracia"
level = "B1"
situation = "Para se apresentar no corredor ou tocando a campainha."
say = "Hi, I'm your new neighbor!"
meaning = "Oi, sou seu novo vizinho!"
accept = ["hello I'm your new neighbor", "hi I just moved in", "hello I just moved in", "hi I've just moved in"]
tip = "Exemplo: Hi, I'm your new neighbor! I'm in 3B."

[[phrase]]
topic = "casa e burocracia"
level = "B1"
situation = "Para avisar o proprietário ou o zelador de um defeito."
say = "The heating isn't working."
meaning = "O aquecimento não está funcionando."
accept = ["the heat isn't working", "the heating is not working", "the heating doesn't work", "the heat is not working"]
tip = "Num prédio americano quem conserta é o \"super\" (superintendent) ou a \"management\"."

[[phrase]]
topic = "casa e burocracia"
level = "B1"
situation = "Pedido educado ao vizinho barulhento."
say = "Could you keep the noise down?"
meaning = "Dá para fazer menos barulho?"
accept = ["can you keep the noise down", "could you keep it down", "can you keep it down"]
tip = "Comece com \"sorry to bother you\" para soar gentil. \"Keep it down\" sozinho pode soar seco."

[[phrase]]
topic = "casa e burocracia"
level = "B1"
situation = "Pergunta de vizinho novo."
say = "When is trash day?"
meaning = "Que dia passa o lixeiro?"
accept = ["when's trash day", "when is garbage day", "when is trash pickup", "when do they pick up the trash"]
tip = "Nos EUA \"trash day\" é quando você põe as latas na calçada: \"put the trash cans out on the curb\"."

[[phrase]]
topic = "casa e burocracia"
level = "B1"
situation = "Para pedir indicação a vizinhos ou colegas."
say = "Can you recommend a plumber?"
meaning = "Você conhece um bom encanador?"
accept = ["could you recommend a plumber", "do you know a good plumber", "do you know a plumber"]
tip = "\"Recommend\" não leva \"me\" direto: \"can you recommend a plumber (to me)?\", nunca \"recommend me\"."

[[phrase]]
topic = "casa e burocracia"
level = "B1"
situation = "A pergunta do primeiro dia no bairro, ao vizinho, ao porteiro ou a quem passa na rua."
say = "Is there a supermarket nearby?"
meaning = "Tem um supermercado aqui perto?"
accept = ["is there a supermarket near here", "is there a grocery store nearby", "where's the nearest supermarket"]
tip = "Exemplo: I just moved in. Is there a supermarket nearby?"

[[phrase]]
topic = "casa e burocracia"
level = "B1"
situation = "Um número local é o que destrava banco, entregas e grupos do prédio."
say = "Where can I buy a SIM card?"
meaning = "Onde posso comprar um chip?"
accept = ["where can I get a sim card", "where do I buy a sim card"]
tip = "Nos EUA também se ouve \"prepaid plan\" (pré-pago). \"Where can I get…\" é tão comum quanto \"buy\"."

[[phrase]]
topic = "casa e burocracia"
level = "B1"
situation = "No provador, para pedir outra numeração."
say = "Do you have a bigger size?"
meaning = "Tem um tamanho maior?"
accept = ["do you have a larger size", "have you got a bigger size", "is there a bigger size"]
tip = "Nos EUA o provador é \"fitting room\". \"This in a bigger size\" aponta para a peça: \"do you have this in a medium?\"."

[[phrase]]
topic = "casa e burocracia"
level = "B1"
situation = "No balcão dos correios."
say = "I'd like to send this package."
meaning = "Queria mandar este pacote."
accept = ["I would like to send this package", "I'd like to mail this package", "I want to send this package"]
tip = "Nos EUA \"mail\" é enviar pelo correio; \"ship\" é mandar com transportadora. \"Tracking number\" = rastreio."

[[phrase]]
topic = "casa e burocracia"
level = "B1"
situation = "À noite, no domingo ou no feriado, quando precisa de remédio e tudo parece fechado."
say = "Is there a pharmacy open now?"
meaning = "Tem alguma farmácia aberta agora?"
accept = ["is there a drugstore open now", "is any pharmacy open now", "is there a pharmacy open right now"]
tip = "Nos EUA a \"drugstore\" (CVS, Walgreens) vende de tudo e tem o balcão \"pharmacy\" lá dentro."

[[phrase]]
topic = "casa e burocracia"
level = "B1"
situation = "Na recepção da clínica ou ao telefone, quando não é emergência mas você precisa ser atendido."
say = "I'd like to see a doctor."
meaning = "Queria consultar um médico."
accept = ["I would like to see a doctor", "can I see a doctor", "I'd like to see the doctor"]
tip = "\"See a doctor\" = ser atendido. Nos EUA você costuma ter um \"primary care doctor\" pelo seu seguro."

[[phrase]]
topic = "casa e burocracia"
level = "B1"
situation = "Para dizer ao médico o sintoma e há quanto tempo."
say = "I've had a fever since yesterday."
meaning = "Estou com febre desde ontem."
accept = ["I have had a fever since yesterday", "I've had a temperature since yesterday", "I've had a fever since last night"]
tip = "Inglês usa o present perfect com \"since\": \"I've had\", nunca \"I have a fever since yesterday\"."

[[phrase]]
topic = "casa e burocracia"
level = "B1"
situation = "No balcão da farmácia, antes de pagar."
say = "Do I need a prescription?"
meaning = "Preciso de receita?"
accept = ["can I buy this without a prescription", "is it prescription only"]
tip = "Exemplo: I'd like this antibiotic. Do I need a prescription?"

[[phrase]]
topic = "casa e burocracia"
level = "B1"
situation = "Na recepção, quando pedem o cartão do plano."
say = "I don't have insurance yet."
meaning = "Ainda não tenho plano de saúde."
accept = ["I do not have insurance yet", "I don't have health insurance yet", "I'm not insured yet"]
tip = "\"Yet\" vai no fim da frase negativa: \"I don't have it yet\". Pergunte \"what's the self-pay rate?\" (preço particular)."

[[phrase]]
topic = "casa e burocracia"
level = "B1"
situation = "Na urgência ou, melhor ainda, antes dela: descubra no primeiro mês e salve no celular."
say = "Where is the nearest hospital?"
meaning = "Onde fica o hospital mais próximo?"
accept = ["where's the nearest hospital", "where is the closest hospital", "is there a hospital near here"]
tip = "\"Nearest\" é o mais próximo; \"closest\" também serve. Numa emergência real, ligue 911."

[[phrase]]
topic = "gírias e conversa"
level = "B1"
situation = "O cumprimento completo entre amigos."
say = "Hey dude, what's up?"
meaning = "E aí, mano, beleza?"
accept = ["hey man what's up", "yo what's up"]

[[phrase]]
topic = "gírias e conversa"
level = "B1"
situation = "Ao reencontrar alguém depois de muito tempo."
say = "Long time no see!"
meaning = "Há quanto tempo!"
accept = ["it's been a while", "it's been forever"]
tip = "\"Long time no see\" é gramática \"errada\" de propósito e todo mundo usa. Não traduza para outras frases."

[[phrase]]
topic = "gírias e conversa"
level = "B1"
situation = "Sair rápido de uma conversa ou festa com amigos."
say = "Gotta go, see ya!"
meaning = "Tenho que vazar, falou!"
accept = ["I gotta go see ya", "gotta run see ya"]

[[phrase]]
topic = "gírias e conversa"
level = "B1"
situation = "Agradecer um favor e prometer retribuir: carona, empréstimo, ajuda na mudança."
say = "Thanks, I owe you one!"
meaning = "Valeu, fico te devendo!"
accept = ["I owe you one", "thanks man I owe you one"]

[[phrase]]
topic = "gírias e conversa"
level = "B1"
situation = "Comemorar a boa notícia de um amigo: emprego novo, viagem, noivado."
say = "No way, that's awesome!"
meaning = "Mentira! Que legal!"
accept = ["no way that's so cool", "no way that's amazing"]
tip = "Americanos exageram no entusiasmo: \"that's awesome!\" é reação normal até para notícias pequenas."

[[phrase]]
topic = "gírias e conversa"
level = "B1"
situation = "Parar a conversa porque ouviu algo difícil de acreditar."
say = "Wait, are you for real?"
meaning = "Peraí, é sério?"
accept = ["wait for real", "hold on are you serious"]

[[phrase]]
topic = "gírias e conversa"
level = "B1"
situation = "Admitir que esqueceu algo pequeno: responder uma mensagem, trazer o carregador."
say = "My bad, I totally forgot!"
meaning = "Foi mal, esqueci totalmente!"
accept = ["my bad I forgot", "sorry I totally forgot"]
tip = "\"Totally\" dá ênfase informal. Na escrita \"I totes forgot\" é piada; \"totally\" basta."

[[phrase]]
topic = "gírias e conversa"
level = "B1"
situation = "Reagir a uma história absurda ou incrível: um show, uma coincidência, uma fofoca."
say = "That's crazy, I can't believe it!"
meaning = "Que loucura, nem acredito!"
accept = ["that's insane I can't believe it", "that's wild I can't believe it"]

[[phrase]]
topic = "gírias e conversa"
level = "B1"
situation = "Convidar um amigo para sair sem compromisso."
say = "Wanna hang out later?"
meaning = "Bora dar um rolê mais tarde?"
accept = ["want to hang out later", "do you wanna hang out later"]
tip = "\"Wanna\" é a fala de \"want to\". Fale à vontade, mas escreva \"want to\" em mensagens de trabalho."

[[phrase]]
topic = "gírias e conversa"
level = "B1"
situation = "Aceitar um plano com vontade, numa resposta só."
say = "Sounds good, I'm down!"
meaning = "Fechou, tô dentro!"
accept = ["sounds good I'm in", "sounds great count me in"]

[[phrase]]
topic = "gírias e conversa"
level = "B1"
situation = "Recusar um convite ou oferta de amigo sem ofender."
say = "I'm good, thanks though."
meaning = "Tô de boa, mas valeu."
accept = ["I'm good but thanks", "I'll pass thanks"]
tip = "\"Though\" no fim da frase = \"mesmo assim\": \"thanks though\" = \"mas obrigado mesmo assim\". Muito comum."

[[phrase]]
topic = "gírias e conversa"
level = "B1"
situation = "Dizer não com gentileza e deixar a porta aberta."
say = "Maybe another time?"
meaning = "Quem sabe outro dia?"
accept = ["maybe some other time", "maybe next time"]

[[phrase]]
topic = "gírias e conversa"
level = "B1"
situation = "Cobrar em tom de brincadeira um amigo que costuma furar."
say = "Don't bail on me again!"
meaning = "Não vai furar de novo!"
accept = ["don't flake on me again"]
tip = "\"On me\" indica quem sai prejudicado: \"bail on me\" = \"me deixar na mão\". Igual em \"don't give up on me\"."

[[phrase]]
topic = "gírias e conversa"
level = "B1"
situation = "Propor comer algo rápido a amigos quando a fome aperta."
say = "Let's grab a bite, I'm starving."
meaning = "Bora comer? Tô morrendo de fome."
accept = ["let's get food I'm starving", "let's grab some food I'm starving"]

[[phrase]]
topic = "gírias e conversa"
level = "B1"
situation = "Chamar amigos ou colegas próximos para beber algo à noite."
say = "Wanna get drinks tonight?"
meaning = "Bora tomar uma gelada hoje?"
accept = ["want to get drinks tonight", "wanna grab a drink tonight"]
tip = "\"Get drinks\" é sair para beber, geralmente álcool. Para café, diga \"grab a coffee\"."

[[phrase]]
topic = "gírias e conversa"
level = "B1"
situation = "Contar que um bar, show ou festa estava cheio demais."
say = "It was so packed!"
meaning = "Tava lotado!"
accept = ["the place was packed", "it was packed"]
tip = "\"So\" dá ênfase na fala: \"it was so packed\". Evite \"it was very packed\", que soa de livro."

[[phrase]]
topic = "gírias e conversa"
level = "B1"
situation = "Comentar com quem foi (ou não foi) que a festa foi incrível."
say = "The party last night was epic!"
meaning = "A festa de ontem foi épica!"
accept = ["last night's party was epic", "the party was amazing"]

[[phrase]]
topic = "gírias e conversa"
level = "B1"
situation = "Recusar um programa com sinceridade e humor porque o dinheiro acabou."
say = "I can't go, I'm broke."
meaning = "Não dá, tô sem grana."
accept = ["I can't I'm broke", "I can't go I'm totally broke"]

[[phrase]]
topic = "gírias e conversa"
level = "B1"
situation = "Recusar sair à noite porque está exausto."
say = "I'm wiped out, I'm staying in."
meaning = "Tô morto, vou ficar em casa."
accept = ["I'm exhausted I'm staying in", "I'm beat I'm staying in"]
tip = "\"Stay in\" = ficar em casa (não sair); \"stay out\" = ficar fora até tarde. Uma preposição muda tudo."

[[phrase]]
topic = "gírias e conversa"
level = "B1"
situation = "Pedir a um amigo próximo que conte a novidade ou fofoca."
say = "Okay, spill the tea!"
meaning = "E aí, qual é a fofoca?"
accept = ["okay what's the tea", "so what's the tea"]

[[phrase]]
topic = "gírias e conversa"
level = "B1"
situation = "Desabafar com um amigo sobre a ansiedade antes de uma prova, entrevista ou encontro."
say = "I'm freaking out about tomorrow."
meaning = "Tô surtando por causa de amanhã."
accept = ["I'm stressing out about tomorrow", "I'm so stressed about tomorrow"]
tip = "Em inglês fica-se nervoso \"about\" algo: \"freaking out about the exam\", nunca \"for the exam\"."

[[phrase]]
topic = "gírias e conversa"
level = "B1"
situation = "Acalmar um amigo que está nervoso ou pedindo desculpas demais."
say = "No worries, take it easy."
meaning = "Relaxa, tá tudo bem."
accept = ["all good take it easy", "no worries just relax"]

[[phrase]]
topic = "gírias e conversa"
level = "B1"
situation = "Reclamar com amigos que alguém sumiu das mensagens de novo, geralmente num flerte."
say = "He ghosted me again!"
meaning = "Ele me deu ghosting de novo!"
accept = ["she ghosted me again", "they ghosted me again"]
tip = "\"Ghost\" virou verbo regular: \"ghosted\". Parecido: \"left on read\" = visualizou e não respondeu."

[[phrase]]
topic = "viagem"
level = "B1"
situation = "A primeira frase no balcão da companhia."
say = "I'd like to check in."
meaning = "Queria fazer o check-in."
accept = ["I would like to check in", "can I check in here"]
tip = "\"I'd like to\" é o pedido educado padrão. \"I want to check in\" soa exigente para um atendente."

[[phrase]]
topic = "viagem"
level = "B1"
situation = "A resposta para \"janela ou corredor?\"."
say = "A window seat, please."
meaning = "Assento na janela, por favor."
accept = ["window seat please", "window please", "I'd like a window seat"]
tip = "Em inglês o substantivo vem antes: \"window seat\", \"aisle seat\". Nunca \"seat window\"."

[[phrase]]
topic = "viagem"
level = "B1"
situation = "Pergunte antes de pagar excesso de bagagem."
say = "How many bags can I take?"
meaning = "Quantas malas posso levar?"
accept = ["how many bags can I bring", "how many bags can I check"]
tip = "\"How many\" é para coisas contáveis (bags); \"how much\" para incontáveis ou preço (\"how much luggage\")."

[[phrase]]
topic = "viagem"
level = "B1"
situation = "Pergunte a quem está na sua frente antes de esperar meia hora na fila errada."
say = "Is this the right line?"
meaning = "Essa é a fila certa?"
accept = ["am I in the right line", "is this the line"]
tip = "\"Right\" aqui é certo, não direita. \"Wrong line\" é a fila errada."

[[phrase]]
topic = "viagem"
level = "B1"
situation = "As regras mudam de aeroporto para aeroporto: com scanners novos, nem notebook nem líquidos saem da mala."
say = "Do I take out my laptop?"
meaning = "Preciso tirar o notebook?"
accept = ["should I take out my laptop", "does my laptop come out"]

[[phrase]]
topic = "viagem"
level = "B1"
situation = "Quando o cartão de embarque ainda não mostra o portão, ou o painel mudou."
say = "Which gate is it?"
meaning = "Qual é o portão?"
accept = ["what gate is it", "which gate do I go to"]
tip = "Números de portão se dizem dígito a dígito ou como número: \"gate B twelve\", \"gate forty-two\"."

[[phrase]]
topic = "viagem"
level = "B1"
situation = "Chegou correndo ao portão e tem gente em fila?"
say = "Has boarding started?"
meaning = "O embarque já começou?"
accept = ["has boarding begun", "are we boarding yet"]
tip = "\"Boarding\" aqui é substantivo, sem artigo: \"has boarding started?\", não \"has the boarding started?\"."

[[phrase]]
topic = "viagem"
level = "B1"
situation = "Para avisar quem vai buscar você, o hotel ou o balcão da conexão."
say = "My flight is delayed."
meaning = "Meu voo está atrasado."
accept = ["my flight's delayed", "my flight has been delayed"]
tip = "Voo atrasado é \"delayed\", não \"late\". \"Late\" é para quem chega tarde: \"sorry I'm late\"."

[[phrase]]
topic = "viagem"
level = "B1"
situation = "Diga no balcão da companhia ou no telefone de atendimento."
say = "My flight was canceled."
meaning = "Meu voo foi cancelado."
accept = ["my flight was cancelled", "my flight got canceled", "my flight's been canceled"]

[[phrase]]
topic = "viagem"
level = "B1"
situation = "A pergunta clássica do agente de imigração."
say = "What's the purpose of your visit?"
meaning = "Qual é o motivo da sua viagem?"
accept = ["what is the purpose of your visit", "what brings you here"]
tip = "Agentes costumam falar rápido e cortar: \"purpose of your visit?\". Responda só o essencial, sem histórias."

[[phrase]]
topic = "viagem"
level = "B1"
situation = "A resposta mais comum ao \"motivo da viagem\"."
say = "I'm here on vacation."
meaning = "Estou aqui de férias."
accept = ["I am here on vacation", "I'm on vacation"]
tip = "Nos EUA é \"on vacation\". Evite \"in vacations\": sem plural e com \"on\"."

[[phrase]]
topic = "viagem"
level = "B1"
situation = "O agente confere se sua estadia cabe no visto."
say = "How long are you staying?"
meaning = "Quanto tempo vai ficar?"
accept = ["how long will you be staying", "how long will you stay"]
tip = "O presente contínuo fala de planos: \"how long are you staying?\" = quanto tempo vai ficar. Resposta: \"for two weeks\"."

[[phrase]]
topic = "viagem"
level = "B1"
situation = "Resposta a \"onde vai ficar?\"."
say = "I'm staying at a hotel."
meaning = "Vou ficar num hotel."
accept = ["I am staying at a hotel", "I'm staying in a hotel"]
tip = "Com hotel use \"at\": \"staying at the Hilton\". Com pessoas, \"with\": \"staying with a friend\"."

[[phrase]]
topic = "viagem"
level = "B1"
situation = "Para o agente que pergunta se já esteve no país, e para qualquer pessoa: abre portas para dicas e ajuda."
say = "It's my first time here."
meaning = "É a minha primeira vez aqui."
accept = ["it is my first time here", "this is my first time here", "first time here"]
tip = "A pergunta do agente é \"have you been here before?\". Responda \"no, it's my first time\"."

[[phrase]]
topic = "viagem"
level = "B1"
situation = "A resposta ao agente da alfândega quando você só traz coisas pessoais."
say = "I have nothing to declare."
meaning = "Não tenho nada a declarar."
accept = ["nothing to declare", "I've got nothing to declare"]
tip = "Inglês não aceita dupla negação: \"I have nothing\" ou \"I don't have anything\", nunca \"I don't have nothing\"."

[[phrase]]
topic = "viagem"
level = "B1"
situation = "Diga no balcão de bagagem antes de sair da área restrita."
say = "My luggage didn't arrive."
meaning = "Minha bagagem não chegou."
accept = ["my bags didn't arrive", "my luggage hasn't arrived", "my suitcase didn't arrive"]
tip = "Depois de \"didn't\" o verbo volta à forma base: \"didn't arrive\", nunca \"didn't arrived\"."

[[phrase]]
topic = "viagem"
level = "B1"
situation = "Vá direto ao balcão de transferências da companhia."
say = "I missed my connection."
meaning = "Perdi minha conexão."
accept = ["I missed my connecting flight", "I've missed my connection"]
tip = "Perder voo, trem ou ônibus é \"miss\"; perder um objeto é \"lose\". \"I lost my connection\" soaria como sinal de internet."

[[phrase]]
topic = "viagem"
level = "B1"
situation = "Para quando as placas confundem, principalmente em aeroportos grandes com trem entre terminais."
say = "Where is baggage claim?"
meaning = "Onde retiro a bagagem?"
accept = ["where's baggage claim", "where is the baggage claim", "where do I get my bags"]

[[phrase]]
topic = "viagem"
level = "B1"
situation = "Peça no balcão ou no app depois de cancelamento ou conexão perdida."
say = "Can you rebook me on another flight?"
meaning = "Pode me colocar no próximo voo?"
accept = ["could you rebook me on another flight", "can you put me on another flight", "can I get on the next flight"]
tip = "\"Rebook me on\" é a colocação certa: \"rebook me on the next flight\". \"Can you…?\" soa educado com funcionário."

[[phrase]]
topic = "viagem"
level = "B1"
situation = "A primeira pergunta no balcão de informações do aeroporto."
say = "How do I get downtown?"
meaning = "Como chego ao centro?"
accept = ["how can I get downtown", "how do I get into town"]
