[[phrase]]
topic = "negociação e opinião"
level = "B2"
situation = "Apresenta uma ideia sem pressionar: você convida o outro a pensar, em vez de exigir que concorde."
say = "Merece la pena considerarlo."
meaning = "Vale a pena considerar."
accept = ["vale la pena considerarlo"]

[[phrase]]
topic = "negociação e opinião"
level = "B2"
situation = "Traz o outro lado de uma questão."
say = "Por otro lado..."
meaning = "Por outro lado..."
accept = ["por otra parte"]

[[phrase]]
topic = "negociação e opinião"
level = "B2"
situation = "Resume o seu argumento mais forte numa frase."
say = "La principal ventaja es el precio."
meaning = "A principal vantagem é o preço."
accept = ["la mayor ventaja es el precio"]
tip = "Em espanhol \"principal\" costuma vir antes: \"la principal ventaja\" soa mais natural que \"la ventaja principal\"."

[[phrase]]
topic = "negociação e opinião"
level = "B2"
situation = "Discorda sem fechar a porta: diz que você ainda precisa de argumentos melhores."
say = "No estoy del todo convencido."
meaning = "Não estou totalmente convencido."
accept = ["no estoy del todo convencida"]

[[phrase]]
topic = "negociação e opinião"
level = "B2"
situation = "Concede um ponto ao outro."
say = "En eso tienes razón."
meaning = "Nisso você tem razão."
accept = ["en eso tiene razón", "es un punto válido"]

[[phrase]]
topic = "negociação e opinião"
level = "B2"
situation = "Abre uma conversa sobre algo que acabou de acontecer."
say = "¿Te has enterado de la noticia?"
meaning = "Você viu a notícia?"
accept = ["has oído la noticia"]
tip = "\"Enterarse\" é ficar sabendo: \"¿te has enterado?\" é a pergunta clássica de fofoca na Espanha."

[[phrase]]
topic = "negociação e opinião"
level = "B2"
situation = "Acalma uma conversa sobre algo não confirmado: você passa a informação e já avisa que pode não ser verdade."
say = "Al parecer, es solo un rumor."
meaning = "Pelo visto, é só boato."
accept = ["por lo visto es solo un rumor"]

[[phrase]]
topic = "negociação e opinião"
level = "B2"
situation = "Dá uma opinião equilibrada sobre um tema polêmico sem tomar partido logo de cara."
say = "Depende de cómo lo mires."
meaning = "Depende de como você vê."
accept = ["depende de cómo se mire"]

[[phrase]]
topic = "negociação e opinião"
level = "B2"
situation = "Cita a fonte antes de repetir uma informação."
say = "Según el artículo..."
meaning = "Segundo a matéria..."
accept = ["según la noticia"]

[[phrase]]
topic = "negociação e opinião"
level = "B2"
situation = "Lembra que um conflito tem mais de uma versão."
say = "Toda historia tiene dos caras."
meaning = "Toda história tem dois lados."
accept = ["toda moneda tiene dos caras"]
tip = "Na Espanha também se diz \"cada uno cuenta la feria según le va\" (cada um conta a festa como foi para ele)."
