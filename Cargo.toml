[package]
name = "snowlearner"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A pixel-art frost mage that freezes your screen until you practice speaking a new language."
license = "MIT"

[features]
default = ["stt"]
# Local speech recognition (whisper.cpp) + microphone capture. Without it the
# app still runs; phrases are confirmed with the hotkey instead of the mic.
stt = ["dep:whisper-rs", "dep:cpal"]

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
cpal = { version = "0.18", optional = true }
directories = "6"
global-hotkey = "0.8"
png = "0.18"
pollster = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
strsim = "0.11"
toml = "1"
unicode-normalization = "0.1"
ureq = "3"
wgpu = "30"
whisper-rs = { version = "0.16", optional = true }
winit = "0.30"

[dev-dependencies]
hound = "3"
tempfile = "3"

# whisper.cpp is unusably slow unoptimized; keep it fast even in debug builds.
[profile.dev.package.whisper-rs-sys]
opt-level = 3
[profile.dev.package."*"]
opt-level = 1
