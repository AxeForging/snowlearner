name: release

# EXPERIMENT BRANCH for #58, never merged: builds Windows variants of whisper.cpp
# (and one Linux variant) with verbose logs, to find why the MSVC build is slow.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  GGML_NATIVE: "OFF"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, variant: win-msvc, bin: snowlearner.exe }
          - { os: windows-latest, variant: win-clangcl, bin: snowlearner.exe }
          - { os: windows-latest, variant: win-llamafile, bin: snowlearner.exe }
          - { os: windows-latest, variant: win-flags, bin: snowlearner.exe }
          - { os: ubuntu-22.04, variant: linux-llamafile, bin: snowlearner }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libclang-dev libxkbcommon-dev libwayland-dev
      - name: variant
        shell: bash
        run: |
          case "${{ matrix.variant }}" in
            win-clangcl) echo "CMAKE_GENERATOR_TOOLSET=ClangCL" >> "$GITHUB_ENV" ;;
            win-llamafile|linux-llamafile) echo "GGML_LLAMAFILE=ON" >> "$GITHUB_ENV" ;;
            win-flags)
              echo "CMAKE_C_FLAGS_RELEASE=/MD /O2 /Ob2 /DNDEBUG" >> "$GITHUB_ENV"
              echo "CMAKE_CXX_FLAGS_RELEASE=/MD /O2 /Ob2 /DNDEBUG" >> "$GITHUB_ENV"
              ;;
          esac
      - name: build (verbose, log kept)
        shell: bash
        run: cargo build --release --locked -vv > build.log 2>&1 || { tail -80 build.log; exit 1; }
      - name: what the native build was given
        if: always()
        shell: bash
        run: |
          grep -a -E "running: |CMAKE_(C|CXX)_FLAGS|CMAKE_BUILD_TYPE|CMAKE_GENERATOR|The C compiler identification|GGML_LLAMAFILE|Adding CPU backend variant" build.log | cut -c1-1500 | head -60 || true
          echo "--- one ggml compile line"
          grep -a -m3 -E "(cl\\.exe|clang-cl|ClCompile|/arch:AVX2|-mavx2).*" build.log | cut -c1-2500 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp-${{ matrix.variant }}
          path: |
            target/release/${{ matrix.bin }}
            build.log
